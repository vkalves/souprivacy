name: Convert preview videos for iPhone

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/convert-preview-videos.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show original video formats
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate -of default=noprint_wrappers=1 elianeprevias/previa5.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate -of default=noprint_wrappers=1 elianeprevias/previa6.mp4

      - name: Convert videos to Safari-compatible MP4
        run: |
          ffmpeg -y -i elianeprevias/previa5.mp4 -map 0:v:0 -map '0:a?' -vf "fps=30,scale='min(720,iw)':-2" -c:v libx264 -preset medium -crf 24 -profile:v main -level 3.1 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart /tmp/previa5.mp4
          ffmpeg -y -i elianeprevias/previa6.mp4 -map 0:v:0 -map '0:a?' -vf "fps=30,scale='min(720,iw)':-2" -c:v libx264 -preset medium -crf 24 -profile:v main -level 3.1 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart /tmp/previa6.mp4
          mv /tmp/previa5.mp4 elianeprevias/previa5.mp4
          mv /tmp/previa6.mp4 elianeprevias/previa6.mp4

      - name: Validate converted videos
        run: |
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 elianeprevias/previa5.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 elianeprevias/previa5.mp4)" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 elianeprevias/previa6.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 elianeprevias/previa6.mp4)" = "yuv420p"

      - name: Commit converted videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elianeprevias/previa5.mp4 elianeprevias/previa6.mp4
          git commit -m "Converte prévias para H.264 compatível com iPhone"
          git push
