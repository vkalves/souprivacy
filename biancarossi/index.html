<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf5">
  <title>Chamada de vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#292b2e;--muted:#727478;--orange:#bb5200;--orange-1:#ff7c00;--orange-2:#ff9800;--orange-3:#ffc000;--line:#eeece9;--paper:#fffaf5;--danger:#ef5350;--soft-shadow:0 20px 70px rgba(75,45,20,.10);--small-shadow:0 10px 30px rgba(75,45,20,.10)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
    html,body{min-height:100%;background:#f4f2ef;touch-action:none;overscroll-behavior:none}
    body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(255,152,0,.32);outline-offset:3px}
    .phone{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(circle at 12% 6%,rgba(255,192,0,.16),transparent 28%),radial-gradient(circle at 95% 28%,rgba(255,124,0,.12),transparent 35%),var(--paper);isolation:isolate}
    .phone::before{content:"";position:absolute;inset:-25%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,157,0,.13),transparent 28%);opacity:0}
    .phone[data-state="incoming"]::before{animation:incomingGlow 2.8s ease-in-out infinite}
    @keyframes incomingGlow{0%,100%{opacity:.25;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
    @media(min-width:560px){body{padding:28px}.phone{height:min(900px,94dvh);border:1px solid rgba(41,43,46,.08);border-radius:38px;box-shadow:var(--soft-shadow)}}
    .ambient{position:absolute;border-radius:999px;filter:blur(10px);pointer-events:none;z-index:-1}.ambient.a{width:180px;height:180px;left:-95px;top:140px;background:rgba(255,152,0,.12)}.ambient.b{width:210px;height:210px;right:-130px;bottom:140px;background:rgba(255,192,0,.14)}
    .phone[data-state="incoming"] .ambient.a{animation:driftA 6s ease-in-out infinite}.phone[data-state="incoming"] .ambient.b{animation:driftB 7s ease-in-out infinite}
    @keyframes driftA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22px,16px,0) scale(1.12)}}
    @keyframes driftB{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-18px,-20px,0) scale(1.08)}}
    .topbar{position:relative;z-index:20;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
    .phone[data-state="incoming"] .topbar{animation:introTop .72s cubic-bezier(.22,1,.36,1) both}
    @keyframes introTop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
    .top-icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.84);display:grid;place-items:center;color:var(--ink);box-shadow:0 5px 18px rgba(41,43,46,.05)}.top-icon svg{width:20px;height:20px;fill:currentColor}.top-icon.hidden{visibility:hidden}
    .brand{text-align:center;min-width:0}.brand-kicker{font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#a5a19d;margin-bottom:5px}.brand-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;background:#111}.phone[data-state="in-call"].has-remote .remote-video{display:block}
    .video-overlay{position:absolute;inset:0;z-index:2;display:none;pointer-events:none;background:linear-gradient(180deg,rgba(15,14,13,.45) 0%,rgba(15,14,13,.08) 30%,rgba(15,14,13,.10) 56%,rgba(15,14,13,.70) 100%)}.phone[data-state="in-call"].has-remote .video-overlay{display:block}
    .phone.signal-drop .remote-video{animation:signalJitter .22s steps(2,end) infinite;filter:saturate(.75) contrast(1.05)}
    .phone.signal-drop .video-overlay{display:block;background:linear-gradient(180deg,rgba(15,14,13,.26),rgba(15,14,13,.15),rgba(15,14,13,.58))}
    @keyframes signalJitter{0%{transform:translate(0,0) scale(1.002)}35%{transform:translate(-1px,1px) scale(1.005)}70%{transform:translate(1px,0) scale(1.003)}100%{transform:translate(0,0) scale(1.002)}}
    .media-status{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:rgba(20,18,16,.46);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;text-align:center;padding:24px}.media-status.show{display:grid}.media-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 20px;border-radius:20px;background:rgba(20,18,16,.48);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:700}.media-spinner{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.24);border-top-color:#fff;animation:mediaSpin .75s linear infinite}@keyframes mediaSpin{to{transform:rotate(360deg)}}
    .pause-screen{position:absolute;inset:0;z-index:11;display:none;place-items:center;background:radial-gradient(circle at 50% 36%,rgba(255,152,0,.12),transparent 34%),rgba(18,17,16,.90);color:#fff;text-align:center;padding:24px}.pause-screen.show{display:grid}.pause-card{display:flex;flex-direction:column;align-items:center;gap:10px}.pause-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 34px rgba(0,0,0,.22)}.pause-icon svg{width:28px;height:28px;fill:#fff}.pause-title{font-size:20px;font-weight:700}.pause-sub{max-width:260px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.72)}
    .stage{position:relative;z-index:6;height:calc(100% - 72px);display:flex;flex-direction:column;align-items:center;padding:34px 32px calc(138px + env(safe-area-inset-bottom));text-align:center}
    .phone[data-state="incoming"] .stage,.phone[data-state="connecting"]:not(.recovering) .stage{padding-top:6px;padding-bottom:40px}
    .eyebrow{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(187,82,0,.10);border-radius:999px;background:rgba(255,255,255,.82);font-size:11px;font-weight:600;color:var(--orange);box-shadow:0 8px 24px rgba(112,66,21,.06)}
    .phone[data-state="incoming"] .eyebrow,.phone[data-state="connecting"]:not(.recovering) .eyebrow{padding:4px 10px;gap:5.5px;border-color:rgba(114,116,120,.22);background:rgba(235,233,230,.94);color:#6e7074;font-size:11px;font-weight:600;letter-spacing:-.01em;box-shadow:none;animation:none}
    .phone[data-state="incoming"].online-ready .eyebrow,.phone[data-state="connecting"]:not(.recovering).online-ready .eyebrow{border-color:rgba(33,166,84,.22);background:rgba(232,249,238,.90);color:#16803c;box-shadow:0 4px 14px rgba(21,128,61,.06)}
    .eyebrow-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--orange-1),var(--orange-3));box-shadow:0 0 0 4px rgba(255,152,0,.10)}
    .phone[data-state="incoming"] .eyebrow-dot,.phone[data-state="connecting"]:not(.recovering) .eyebrow-dot{width:6px;height:6px;background:#8e9095;box-shadow:none;animation:none}
    .phone[data-state="incoming"].online-ready .eyebrow-dot,.phone[data-state="connecting"]:not(.recovering).online-ready .eyebrow-dot{background:#21a654;box-shadow:0 0 0 3px rgba(33,166,84,.14);animation:onlinePing 1.9s ease-out infinite}@keyframes onlinePing{0%,100%{box-shadow:0 0 0 2.5px rgba(33,166,84,.14)}50%{box-shadow:0 0 0 6px rgba(33,166,84,0)}}
    .avatar-wrap{position:relative;width:174px;height:174px;margin:28px auto 24px}
    .avatar-wrap::before,.avatar-ring,.avatar-ring::after{display:none}
    .avatar{position:absolute;inset:10px;border-radius:50%;overflow:hidden;background:#f0ece8;box-shadow:0 18px 45px rgba(83,49,18,.16),0 0 0 6px rgba(255,255,255,.82)}
    .avatar img{width:100%;height:100%;display:block;object-fit:cover}.avatar-fallback{position:absolute;inset:0;display:none;place-items:center;background:#f2eee9;color:#b4aca5}.avatar-fallback svg{width:54px;height:54px;fill:currentColor}.avatar.no-photo img{display:none}.avatar.no-photo .avatar-fallback{display:grid}
    .name-line{display:flex;align-items:center;justify-content:center;gap:7px}.phone[data-state="incoming"] .name-line{animation:introText .72s .34s cubic-bezier(.22,1,.36,1) both}.name{font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.035em}.verified{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--orange-1),var(--orange-3));color:#fff;box-shadow:0 4px 12px rgba(255,124,0,.22)}.verified svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.phone[data-state="incoming"] .verified{animation:verifiedPop .65s .68s cubic-bezier(.18,1.4,.32,1) both}@keyframes verifiedPop{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
    .substatus{margin-top:12px;color:var(--muted);font-size:15px;line-height:1.45}.phone[data-state="incoming"] .substatus{animation:introText .72s .44s cubic-bezier(.22,1,.36,1) both}@keyframes introText{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .call-timer{position:absolute;top:calc(54px + env(safe-area-inset-top));left:14px;z-index:59;display:none;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(24,24,24,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 5px 16px rgba(0,0,0,.07);color:rgba(255,255,255,.88);font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.02em;pointer-events:none;opacity:1;transform:translateY(0) scale(1);transition:opacity .22s ease,transform .24s ease,visibility 0s linear}
    .phone[data-state="in-call"] .call-timer{display:inline-flex}
    .phone[data-state="in-call"].controls-hidden .call-timer{opacity:0;transform:translateY(-5px) scale(.96);visibility:hidden;transition:opacity .22s ease,transform .24s ease,visibility 0s linear .22s}
    .timer-live-dot{width:6px;height:6px;border-radius:50%;background:rgba(198,243,208,.92);box-shadow:0 0 0 3px rgba(198,243,208,.09);flex:0 0 auto}
    .timer-value{min-width:31px;text-align:center;line-height:1}
    .connecting-card{display:none;margin-top:26px;padding:12px 22px;border:1px solid rgba(255,152,0,.25);border-radius:999px;background:rgba(255,255,255,.92);color:var(--orange);font-size:14px;font-weight:600;letter-spacing:-.01em;box-shadow:0 12px 28px rgba(187,82,0,.10);align-items:center;justify-content:center;gap:10px}.phone[data-state="connecting"] .connecting-card{display:inline-flex;animation:connectIn .35s cubic-bezier(.22,1,.36,1) both}@keyframes connectIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
    .calling-spinner{width:16px;height:16px;border-radius:50%;border:2.2px solid rgba(255,152,0,.22);border-top-color:var(--orange-1);animation:recoverySpin .75s linear infinite;flex:0 0 auto}
    .calling-dots{display:inline-flex;margin-left:1px}.calling-dots span{animation:callingDot 1.2s infinite ease-in-out}.calling-dots span:nth-child(2){animation-delay:.2s}.calling-dots span:nth-child(3){animation-delay:.4s}@keyframes callingDot{0%,80%,100%{opacity:.22}40%{opacity:1}}
    .phone.recovering .connecting-card{display:inline-flex!important;align-items:center;gap:9px;color:var(--orange);font-weight:700;background:rgba(255,255,255,.92)}.phone.recovering .controls{pointer-events:none;opacity:.58;filter:saturate(.7)}.phone.recovering .stage{animation:recoveryBreath 1.25s ease-in-out infinite}@keyframes recoverySpin{to{transform:rotate(360deg)}}@keyframes recoveryBreath{0%,100%{opacity:1}50%{opacity:.72}}
    .phone[data-state="in-call"].has-remote .stage{align-items:flex-start;text-align:left;padding-top:18px;color:#fff;pointer-events:none}.phone[data-state="in-call"].has-remote .eyebrow,.phone[data-state="in-call"].has-remote .avatar-wrap{display:none}.phone[data-state="in-call"].has-remote .name-line{justify-content:flex-start}.phone[data-state="in-call"].has-remote .name{font-size:27px;text-shadow:0 2px 12px rgba(0,0,0,.28)}.phone[data-state="in-call"] .substatus{display:none}
    /* HUD minimalista da chamada: nome/verificado + qualidade sempre visível */
    .call-hud{position:absolute;top:calc(16px + env(safe-area-inset-top));left:14px;z-index:60;display:none;align-items:center;gap:7px;max-width:calc(100% - 64px);pointer-events:none}
    .phone[data-state="in-call"] .call-hud{display:flex}
    .hud-identity,.quality-indicator{height:30px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(24,24,24,.30);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 5px 16px rgba(0,0,0,.08);color:rgba(255,255,255,.92)}
    .hud-identity{gap:5px;min-width:0;padding:0 9px;border-radius:11px}
    .hud-name{max-width:108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:-.01em}
    .hud-verified{width:13px;height:13px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);color:#db7800;flex:0 0 auto}
    .hud-verified svg{width:8px;height:8px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
    .quality-indicator{gap:6px;padding:0 9px;border-radius:11px;font-size:10px;font-weight:600;letter-spacing:.01em;transition:background .28s ease,border-color .28s ease,color .28s ease}
    .quality-bars{height:11px;display:flex;align-items:flex-end;gap:1.5px}
    .quality-bars span{display:block;width:2.5px;border-radius:2px;background:currentColor;opacity:.28;transition:opacity .25s ease,height .25s ease}.quality-bars span:nth-child(1){height:4px}.quality-bars span:nth-child(2){height:7px}.quality-bars span:nth-child(3){height:10px}
    .quality-indicator[data-quality="high"]{color:#dff7e7}.quality-indicator[data-quality="high"] .quality-bars span{opacity:.92}
    .quality-indicator[data-quality="medium"]{color:#fff0c9;background:rgba(91,68,20,.31);border-color:rgba(255,231,174,.22)}.quality-indicator[data-quality="medium"] .quality-bars span:nth-child(-n+2){opacity:.90}.quality-indicator[data-quality="medium"] .quality-bars span:nth-child(3){opacity:.20}
    .quality-indicator[data-quality="low"]{color:#ffe3cf;background:rgba(94,48,18,.34);border-color:rgba(255,214,183,.24)}.quality-indicator[data-quality="low"] .quality-bars span:nth-child(1){opacity:.92}.quality-indicator[data-quality="low"] .quality-bars span:nth-child(n+2){opacity:.20}
    .phone[data-state="in-call"] .stage .name-line{display:none}
    .phone[data-state="in-call"] .topbar{opacity:0;pointer-events:none}
    .phone[data-state="in-call"].has-remote .stage{padding-top:66px}
    .self-cam{position:absolute;top:calc(62px + env(safe-area-inset-top));right:14px;width:94px;height:136px;border-radius:18px;overflow:hidden;z-index:15;display:none;background:#e7e2dd;border:1px solid rgba(255,255,255,.72);box-shadow:0 12px 28px rgba(0,0,0,.18)}.phone[data-state="in-call"] .self-cam{display:block;animation:selfIn .45s cubic-bezier(.22,1,.36,1) both}@keyframes selfIn{from{opacity:0;transform:translateY(-8px) scale(.88)}to{opacity:1;transform:none}}.self-video{width:100%;height:100%;display:block;object-fit:cover;background:#111}.self-placeholder{display:none;position:absolute;inset:0;place-items:center;background:#eee8e1;color:#958d86}.self-placeholder svg{width:28px;height:28px;fill:currentColor}.self-cam.no-video .self-video,.self-cam.off .self-video{display:none}.self-cam.no-video .self-placeholder,.self-cam.off .self-placeholder{display:grid}
    .flip-cam{position:absolute;top:calc(16px + env(safe-area-inset-top));right:14px;left:auto;z-index:61;width:30px;height:30px;border:1px solid rgba(255,255,255,.20);border-radius:10px;display:none;place-items:center;background:rgba(24,24,24,.26);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.88);box-shadow:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .22s ease,transform .24s ease,visibility 0s linear}.phone[data-state="in-call"] .flip-cam{display:grid}.flip-cam svg{width:15px;height:15px;fill:currentColor}.flip-cam.spin svg{animation:flipspin .5s ease}@keyframes flipspin{to{transform:rotate(360deg)}}
    .cam-prompt{position:absolute;left:18px;right:18px;bottom:calc(114px + env(safe-area-inset-bottom));z-index:45;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:22px;background:rgba(24,22,20,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);box-shadow:0 16px 40px rgba(0,0,0,.28);color:#fff;animation:connectIn .32s cubic-bezier(.22,1,.36,1) both}
    .phone[data-state="in-call"] .cam-prompt.show{display:flex}
    .cam-prompt-label{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:-.01em}
    .cam-prompt-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,152,0,.20);color:var(--orange-3);display:grid;place-items:center;flex:0 0 auto}
    .cam-prompt-icon svg{width:17px;height:17px;fill:currentColor}
    .cam-prompt-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .cam-opt{height:34px;padding:0 15px;border-radius:999px;border:0;font-size:12px;font-weight:700;cursor:pointer;transition:transform .14s ease,opacity .18s ease}
    .cam-opt:active{transform:scale(.95)}
    .cam-opt.yes{background:linear-gradient(135deg,var(--orange-1),var(--orange-2));color:#fff;box-shadow:0 6px 16px rgba(255,124,0,.28)}
    .cam-opt.no{background:rgba(255,255,255,.14);color:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.16)}
    .controls{position:absolute;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:1px solid rgba(238,236,233,.86);border-radius:30px;background:rgba(255,255,255,.90);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 55px rgba(62,40,22,.13);padding:14px;transition:opacity .25s ease,filter .25s ease,transform .28s ease}
    .phone[data-state="incoming"] .controls,.phone[data-state="connecting"]:not(.recovering) .controls{display:none}
    .phone[data-state="in-call"].controls-hidden .controls{opacity:0;transform:translateY(16px);pointer-events:none;filter:saturate(.92)}
    .phone[data-state="in-call"].controls-hidden .flip-cam{opacity:0;transform:translateY(-5px) scale(.92);visibility:hidden;pointer-events:none;transition:opacity .22s ease,transform .24s ease,visibility 0s linear .22s}
    .incoming-controls,.incall-controls,.ended-controls{display:none}
    .phone[data-state="incoming"] .incoming-controls{display:flex;justify-content:center;align-items:center;margin-top:26px;animation:controlsEntrance .82s .52s cubic-bezier(.16,1,.3,1) both}@keyframes controlsEntrance{0%{opacity:0;transform:translateY(22px) scale(.9)}70%{opacity:1;transform:translateY(-2px) scale(1.02)}100%{opacity:1;transform:none}}
    .phone[data-state="in-call"] .incall-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.phone[data-state="ended"] .ended-controls{display:block}
    .phone.one-time-ended .controls,.phone.one-time-ended .sound-toggle,.phone.one-time-ended .flip-cam,.phone.one-time-ended .self-cam,.phone.one-time-ended .cam-prompt{display:none!important}.phone.one-time-ended .stage{padding-bottom:40px}
    .action{position:relative;isolation:isolate;overflow:hidden;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .16s ease,filter .2s ease,box-shadow .2s ease}.action:active{transform:scale(.95)}.decline{display:none!important}

    function getStoredCall(){try{const raw=sessionStorage.getItem(CALL_SESSION_KEY);if(!raw)return null;const d=JSON.parse(raw);return d&&d.active?d:null}catch(e){return null}}function clearCallSession(){try{sessionStorage.removeItem(CALL_SESSION_KEY)}catch(e){}}
    function seedActiveCallSession(){try{sessionStorage.setItem(CALL_SESSION_KEY,JSON.stringify({active:true,seconds:0,segment:0,phase:'video',remoteTime:0,intermissionEndsAt:0,micOff:false,videoOff:true,facingMode:'user',savedAt:Date.now()}))}catch(e){}}
    function saveCallSession(){if((state!=='in-call'&&!recovering)||phone.classList.contains('one-time-ended'))return;try{sessionStorage.setItem(CALL_SESSION_KEY,JSON.stringify({active:true,seconds,segment,phase,remoteTime:Number.isFinite(remoteVideo.currentTime)?remoteVideo.currentTime:0,intermissionEndsAt,micOff:muteMicBtn.classList.contains('off'),videoOff:videoBtn.classList.contains('off'),facingMode,savedAt:Date.now()}))}catch(e){}}
    function showUsedCallEnded(){cleanupActiveCall();phone.classList.add('one-time-ended');setState('ended');callType.textContent='Essa ligação terminou';subStatus.textContent='Essa chamada não está mais disponível.';timerValue.textContent='';hideMediaStatus();closeChat(true)}
    function updateMirror(){selfVideo.style.transform=facingMode==='user'?'scaleX(-1)':'none'}function applyMicState(){const off=muteMicBtn.classList.contains('off');if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!off)}function applyVideoState(){const off=videoBtn.classList.contains('off');selfCam.classList.toggle('off',off);if(localStream)localStream.getVideoTracks().forEach(t=>t.enabled=!off)}function attachStream(){selfVideo.srcObject=localStream;selfCam.classList.remove('no-video');updateMirror();selfVideo.play().catch(()=>{});applyMicState();applyVideoState()}
    async function startCamera(){if(localStream)return true;if(!navigator.mediaDevices?.getUserMedia){selfCam.classList.add('no-video');return false}const tries=[{video:{facingMode},audio:true},{video:true,audio:true},{video:{facingMode},audio:false},{video:true,audio:false}];for(const c of tries){try{localStream=await navigator.mediaDevices.getUserMedia(c);attachStream();return true}catch(e){}}selfCam.classList.add('no-video');return false}
    async function flipCamera(){if(flipping||!localStream||!navigator.mediaDevices?.getUserMedia)return;flipping=true;flipBtn.classList.add('spin');const prev=facingMode;facingMode=facingMode==='user'?'environment':'user';const old=localStream.getVideoTracks()[0];if(old)old.stop();try{const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facingMode}},audio:false}),nt=ns.getVideoTracks()[0];localStream.getVideoTracks().forEach(t=>localStream.removeTrack(t));localStream.addTrack(nt);selfVideo.srcObject=localStream;updateMirror();await selfVideo.play().catch(()=>{});applyVideoState()}catch(e){facingMode=prev}finally{flipping=false;flipBtn.classList.remove('spin');saveCallSession()}}
    function stopCamera(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}selfVideo.srcObject=null;selfCam.classList.remove('no-video');selfCam.classList.toggle('off',videoBtn.classList.contains('off'))}

    function showMediaStatus(t){mediaStatusText.textContent=t;mediaStatus.classList.add('show')}function hideMediaStatus(){mediaStatus.classList.remove('show')}
    function currentSources(){return SEGMENTS[segment]||[]}
    function setRemoteSource(idx=0){sourceIndex=idx;const src=currentSources()[idx];if(!src)return false;clearStutter();remoteVideo.pause();remoteVideo.removeAttribute('src');remoteVideo.src=src;remoteVideo.preload='auto';remoteLoaded=true;remoteVideo.load();return true}
    function ensureRemoteLoaded(){if(remoteLoaded)return;if(state==='in-call')showMediaStatus('Estabelecendo conexão…');setRemoteSource(0)}
    function playRemoteNow(){ensureRemoteLoaded();try{remoteVideo.muted=false;const p=remoteVideo.play();if(p?.catch)p.catch(()=>{remoteVideo.muted=true;remoteVideo.play().catch(()=>{})})}catch(e){}}
    function clearStutter(){clearInterval(stutterTimer);clearTimeout(stutterRelease);stutterTimer=null;stutterRelease=null;stutterStarted=false;phone.classList.remove('signal-drop');markQualityStable()}
    function startStutter(){if(stutterStarted||segment!==0||phase!=='video')return;stutterStarted=true;phone.classList.add('signal-drop');markQualityLow(6500);stutterTimer=setInterval(()=>{if(state!=='in-call'||segment!==0||phase!=='video'){clearStutter();return}try{if(!remoteVideo.paused){remoteVideo.pause();stutterRelease=setTimeout(()=>remoteVideo.play().catch(()=>{}),170+Math.random()*180)}}catch(e){}},720)}
    function clearRemoteRecovery(){clearTimeout(stallRecoveryTimer);stallRecoveryTimer=null}
    function retryRemote(){
      if(state!=='in-call'&&state!=='connecting')return;
      clearTimeout(retryTimer);
      clearRemoteRecovery();
      if(remoteRetryCount>=2){
        hideMediaStatus();
        return;
      }
      retryTimer=setTimeout(()=>{
        if(remoteVideo.readyState>=3&&!remoteVideo.paused){remoteRetryCount=0;hideMediaStatus();return}
        remoteRetryCount++;
        const t=Number.isFinite(remoteVideo.currentTime)?remoteVideo.currentTime:0;
        try{remoteVideo.load()}catch(e){}
        remoteVideo.addEventListener('loadedmetadata',()=>{
          try{remoteVideo.currentTime=t}catch(e){}
          if(state==='in-call')playRemoteNow();
        },{once:true});
      },2500)
    }
    function scheduleRemoteRecovery(){
      clearRemoteRecovery();
      stallRecoveryTimer=setTimeout(()=>{
        if((state==='in-call'||state==='connecting')&&phase==='video'&&remoteVideo.readyState<3&&!remoteVideo.ended){
          retryRemote();
        }
      },6000)
    }
    function restoreRemotePosition(time){ensureRemoteLoaded();const wanted=Math.max(0,Number(time)||0);const seek=()=>{try{if(Number.isFinite(remoteVideo.duration)&&remoteVideo.duration>0)remoteVideo.currentTime=Math.min(wanted,Math.max(0,remoteVideo.duration-.05));else remoteVideo.currentTime=wanted}catch(e){}playRemoteNow()};if(remoteVideo.readyState>=1)seek();else remoteVideo.addEventListener('loadedmetadata',seek,{once:true})}
    function preloadSecondSegment(){if(segment!==0||!SEGMENTS[1]?.[0])return;const link=document.createElement('link');link.rel='preload';link.as='video';link.href=SEGMENTS[1][0];document.head.appendChild(link)}

    function openChat(auto=false){chatPanel.classList.add('open');chatBtn.classList.add('chat-active');if(auto)chatClose.style.display='none';else chatClose.style.display='grid';setTimeout(()=>{chatMessages.scrollTop=chatMessages.scrollHeight},20)}
    function closeChat(force=false){if(phase==='intermission'&&!force)return;chatPanel.classList.remove('open');chatBtn.classList.remove('chat-active');chatClose.style.display='grid'}
    function addMessage(text,who='them'){const b=document.createElement('div');b.className='bubble '+who;b.textContent=text;const tm=document.createElement('span');tm.className='bubble-time';tm.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});b.appendChild(tm);chatMessages.appendChild(b);chatMessages.scrollTop=chatMessages.scrollHeight}
    function updateCountdown(){if(phase!=='intermission')return;const left=Math.max(0,Math.ceil((intermissionEndsAt-Date.now())/1000));chatCountdown.textContent='Bianca volta em '+left+'s';chatCountdown.classList.add('show');chatStatus.textContent='voltando em '+left+'s';if(left<=0)resumeWithSecondVideo()}
    function beginTransitionRecovery(){
      if(segment!==0||phase==='transition-recovery'||phase==='intermission')return;
      clearStutter();
      phase='transition-recovery';
      remoteVideo.pause();
      phone.classList.remove('has-remote');
      pauseScreen.classList.remove('show');
      closeChat(true);
      showMediaStatus('Reconectando chamada…');
      saveCallSession();
      clearTimeout(transitionRecoveryTimer);
      transitionRecoveryTimer=setTimeout(()=>{
        transitionRecoveryTimer=null;
        if(state==='in-call'&&segment===0&&phase==='transition-recovery')beginIntermission();
      },TRANSITION_RECOVERY_MS);
    }
    function beginIntermission(){if(segment!==0||phase==='intermission')return;clearTimeout(transitionRecoveryTimer);transitionRecoveryTimer=null;clearStutter();phase='intermission';remoteVideo.pause();pauseScreen.classList.add('show');hideMediaStatus();phone.classList.remove('has-remote');chatAutoMessageShown=true;openChat(true);chatCountdown.classList.add('show');chatStatus.textContent='ausente por alguns segundos';addMessage('calma amor, volto em 20 segundos','them');intermissionEndsAt=Date.now()+INTERMISSION_MS;saveCallSession();preloadSecondSegment();clearInterval(countdownTimer);updateCountdown();countdownTimer=setInterval(updateCountdown,500)}
    function resumeWithSecondVideo(){if(phase!=='intermission')return;clearInterval(countdownTimer);countdownTimer=null;chatCountdown.classList.remove('show');chatStatus.textContent='na chamada';pauseScreen.classList.remove('show');phase='video';segment=1;sourceIndex=0;remoteLoaded=false;closeChat(true);showMediaStatus('Retomando chamada…');setRemoteSource(0);remoteVideo.addEventListener('canplay',()=>{phone.classList.add('has-remote');hideMediaStatus();playRemoteNow();saveCallSession()},{once:true});playRemoteNow()}
    function finishRemoteCall(){if(state!=='in-call')return;clearCallSession();stopCallTimer();stopCamera();clearStutter();hideMediaStatus();pauseScreen.classList.remove('show');camPrompt.classList.remove('show');closeChat(true);phone.classList.remove('has-remote');phone.classList.add('one-time-ended');setState('ended');callType.textContent='Chamada encerrada';subStatus.textContent='Bianca encerrou a chamada.'}
    function cleanupActiveCall(){clearTimeout(onlineStatusTimer);onlineStatusTimer=null;clearTimeout(callingTimer);callingTimer=null;stopRinging();stopVibration();stopCallTimer();stopCamera();clearStutter();clearRemoteRecovery();clearTimeout(transitionRecoveryTimer);transitionRecoveryTimer=null;clearControlsAutoHide();clearInterval(countdownTimer);clearTimeout(retryTimer);try{remoteVideo.pause();remoteVideo.removeAttribute('src');remoteVideo.load()}catch(e){}remoteLoaded=false;remoteRetryCount=0;pauseScreen.classList.remove('show');camPrompt.classList.remove('show');phone.classList.remove('answering','declining','recovering','has-remote','signal-drop');clearCallSession()}

    remoteVideo.addEventListener('loadeddata',()=>{if(phase==='video'){phone.classList.add('has-remote');remoteRetryCount=0;clearRemoteRecovery();hideMediaStatus();markQualityStable()}});
    remoteVideo.addEventListener('canplay',()=>{if(phase==='video'){remoteRetryCount=0;clearRemoteRecovery();hideMediaStatus();markQualityStable()}});
    remoteVideo.addEventListener('playing',()=>{if(phase==='video'){remoteRetryCount=0;clearRemoteRecovery();hideMediaStatus();markQualityStable()}});
    remoteVideo.addEventListener('timeupdate',()=>{if(remoteVideo.currentTime>0){remoteRetryCount=0;clearRemoteRecovery()}saveCallSession()});
    remoteVideo.addEventListener('waiting',()=>{if(state==='in-call'&&phase==='video'&&!stutterStarted){markQualityLow();showMediaStatus('Sinal instável. Aguardando vídeo…');scheduleRemoteRecovery()}});
    remoteVideo.addEventListener('stalled',()=>{if(state==='in-call'&&phase==='video'&&!stutterStarted){markQualityLow(6000);showMediaStatus('Sinal instável. Aguardando vídeo…');scheduleRemoteRecovery()}});
    remoteVideo.addEventListener('ended',()=>{if(segment+1<SEGMENTS.length)beginTransitionRecovery();else finishRemoteCall()});
    remoteVideo.addEventListener('error',()=>{clearRemoteRecovery();markQualityLow(7000);if(sourceIndex+1<currentSources().length){if(state==='in-call')showMediaStatus('Restabelecendo conexão…');setRemoteSource(sourceIndex+1);if(state==='in-call')playRemoteNow()}else if(state==='in-call'){showMediaStatus('Não foi possível carregar o vídeo. Verifique sua conexão e tente novamente.')}});
    window.addEventListener('online',()=>{markQualityStable();if(state==='in-call'&&phase==='video'){showMediaStatus('Conexão restaurada. Retomando chamada…');retryRemote()}});

    async function recoverCall(saved){recovering=true;stopRinging();stopVibration();clearForcedMotion();phone.classList.remove('one-time-ended');phone.classList.add('recovering');setState('connecting');callType.textContent='Recuperando chamada';subStatus.textContent='Aguarde um instante. Estamos restaurando sua chamada.';setConnectingLabel(false);seconds=Math.max(0,Number(saved.seconds)||0);renderTimer();segment=(saved.segment===1&&SEGMENTS.length>1)?1:0;phase=(saved.phase==='intermission'&&SEGMENTS.length>1)?'intermission':'video';intermissionEndsAt=Number(saved.intermissionEndsAt)||0;facingMode=saved.facingMode==='environment'?'environment':'user';muteMicBtn.classList.toggle('off',!!saved.micOff);const isVideoOff=saved.videoOff!==undefined?!!saved.videoOff:true;videoBtn.classList.toggle('off',isVideoOff);selfCam.classList.toggle('off',isVideoOff);updateMirror();const cam=isVideoOff?Promise.resolve(false):startCamera();await new Promise(r=>setTimeout(r,3000));await cam.catch(()=>false);setState('in-call');phone.classList.remove('recovering');recovering=false;callType.textContent='Chamada de vídeo';subStatus.textContent='';setConnectingLabel(true);startCallTimer(seconds);applyMicState();applyVideoState();if(phase==='intermission'){pauseScreen.classList.add('show');openChat(true);if(!chatAutoMessageShown){addMessage('calma amor, volto em 20 segundos','them');chatAutoMessageShown=true}if(intermissionEndsAt<=Date.now()){resumeWithSecondVideo()}else{clearInterval(countdownTimer);updateCountdown();countdownTimer=setInterval(updateCountdown,500)}}else{remoteLoaded=false;sourceIndex=0;showMediaStatus('Retomando chamada…');setRemoteSource(0);restoreRemotePosition(saved.remoteTime)}saveCallSession()}

    acceptBtn.addEventListener('click',()=>{
      if(state!=='incoming'||hasUsedCall())return;
      markCallUsed();
      seedActiveCallSession();
      clearForcedMotion();
      clearTimeout(onlineStatusTimer);
      onlineStatusTimer=null;
      phone.classList.add('online-ready');
      callType.textContent='online agora';
      stopRinging();
      stopVibration();
      ensureAudio();
      startRinging();
      videoBtn.classList.add('off');
      selfCam.classList.add('off');
      camPrompt.classList.remove('show');
      segment=0;
      phase='video';
      remoteLoaded=false;
      setRemoteSource(0);
      try{
        remoteVideo.muted=true;
        const p=remoteVideo.play();
        if(p&&p.then){
          p.then(()=>{
            if(state!=='in-call'){
              remoteVideo.pause();
              try{remoteVideo.currentTime=0}catch(e){}
            }
          }).catch(()=>{});
        }
      }catch(e){}
      setConnectingLabel(true);
      setState('connecting');
      clearTimeout(callingTimer);
      callingTimer=setTimeout(()=>{
        callingTimer=null;
        stopRinging();
        setState('in-call');
        callType.textContent='Chamada de vídeo';
        if(remoteVideo.readyState<2)showMediaStatus('Conectando vídeo…');
        playRemoteNow();
        startCallTimer(0);
        camPrompt.classList.add('show');
        saveCallSession();
      },3000);
    });
    declineBtn.addEventListener('click',()=>{if(state!=='incoming')return;clearCallSession();stopRinging();stopVibration();clearForcedMotion();phone.classList.add('declining');setTimeout(()=>{phone.classList.remove('declining');setState('ended');callType.textContent='Chamada finalizada';subStatus.textContent='Você cancelou esta chamada.'},300)});
    endBtn.addEventListener('click',()=>{clearCallSession();const dur=timerValue.textContent;cleanupActiveCall();phone.classList.add('one-time-ended');setState('ended');callType.textContent='Chamada encerrada';subStatus.textContent='Duração da chamada: '+dur});
    restartBtn.addEventListener('click',()=>{if(hasUsedCall())showUsedCallEnded();else resetCall()});
    soundToggle.addEventListener('click',()=>{muted=!muted;if(muted)stopRinging()});
    muteMicBtn.addEventListener('click',()=>{muteMicBtn.classList.toggle('off');applyMicState();saveCallSession()});
    videoBtn.addEventListener('click',async()=>{camPrompt.classList.remove('show');videoBtn.classList.toggle('off');if(!videoBtn.classList.contains('off')&&!localStream){await startCamera()}applyVideoState();saveCallSession()});
    camYesBtn.addEventListener('click',async()=>{camPrompt.classList.remove('show');videoBtn.classList.remove('off');selfCam.classList.remove('off');await startCamera();applyVideoState();saveCallSession()});
    camNoBtn.addEventListener('click',()=>{camPrompt.classList.remove('show');videoBtn.classList.add('off');selfCam.classList.add('off');stopCamera();applyVideoState();saveCallSession()});
    chatBtn.addEventListener('click',()=>chatPanel.classList.contains('open')?closeChat():openChat());chatClose.addEventListener('click',()=>closeChat());
    chatForm.addEventListener('submit',e=>{e.preventDefault();const text=chatInput.value.trim();if(!text)return;addMessage(text,'me');chatInput.value=''});
    flipBtn.addEventListener('click',flipCamera);

    /* Interface da chamada: toque no vídeo alterna mostrar/ocultar controles.
       Depois de usar um controle, a interface se recolhe imediatamente. */
    phone.addEventListener('pointerdown',function(e){
      if(state!=='in-call')return;
      if(e.target.closest('.controls,.flip-cam,.chat-panel,.self-cam,.cam-prompt'))return;
      if(phone.classList.contains('controls-hidden'))showCallControls();
      else{clearTimeout(controlsHideTimer);controlsHideTimer=null;hideCallControls()}
    },{passive:true});
    document.querySelectorAll('.incall-controls .mini-action').forEach(btn=>{
      btn.addEventListener('click',()=>{
        if(state!=='in-call'||btn===endBtn)return;
        setTimeout(hideCallControls,70)
      })
    });
    flipBtn.addEventListener('click',()=>{if(state==='in-call')setTimeout(hideCallControls,70)});

    /* Bloqueios de zoom e atalhos de inspeção: são barreiras de interface,
       não uma proteção absoluta contra as ferramentas do navegador. */
    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('dragstart',e=>e.preventDefault());
    document.addEventListener('selectstart',e=>e.preventDefault());
    document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
    document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
    document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
    window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
    document.addEventListener('keydown',e=>{
      const k=String(e.key||'').toLowerCase();
      const zoomShortcut=(e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(k);
      const devShortcut=
        e.key==='F12' ||
        ((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','k'].includes(k)) ||
        ((e.metaKey&&e.altKey)&&['i','j','c','u'].includes(k)) ||
        ((e.ctrlKey||e.metaKey)&&k==='u');
      if(zoomShortcut||devShortcut){e.preventDefault();e.stopPropagation()}
    },true);

    function resetCall(){if(hasUsedCall()){showUsedCallEnded();return}cleanupActiveCall();qualityStartupUntil=0;recovering=false;segment=0;phase='video';sourceIndex=0;intermissionEndsAt=0;chatAutoMessageShown=false;chatMessages.innerHTML='';chatCountdown.classList.remove('show');phone.classList.remove('one-time-ended');setState('incoming');scheduleOnlineStatus();subStatus.textContent='Disponível para chamada de vídeo privada.';seconds=0;timerValue.textContent='00:00';facingMode='user';updateMirror();muteMicBtn.classList.remove('off');videoBtn.classList.add('off');selfCam.classList.add('off');requestAnimationFrame(forceIncomingMotion)}
    window.addEventListener('beforeunload',saveCallSession);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveCallSession()});
    async function init(){updateMirror();const saved=getStoredCall();if(saved){await recoverCall(saved);return}if(hasUsedCall()){showUsedCallEnded();return}scheduleOnlineStatus();requestAnimationFrame(forceIncomingMotion)}init();
  </script>
</body>
</html>
