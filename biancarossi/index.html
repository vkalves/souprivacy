<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bianca Rossi | Exclusivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "v67gqjmjp7");
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

:root {
    /* Tema azul Telegram */
    --privacy-grad-start: #2AABEE; /* azul Telegram vibrante */
    --privacy-grad-end:   #229ED9; /* azul Telegram mais escuro */
    --privacy-accent:     #2AABEE; /* tom intermediário do degradê, para usos sólidos */
    --privacy-text:       #343434; /* cinza-chumbo do texto */

    --bg-grad-start: #eaf6fd;
    --bg-grad-end:   #fcfcfc;
    --card-bg:       #ffffff;
    --badge-bg:      #e8edf1;
    --badge-text:    #4a4a4a;
    --subtitle-text: #555555;
    --secure-text:   #888888;
    --icon-stroke:   #777777;
}

body.dark-mode {
    --bg-grad-start: #0f1115;
    --bg-grad-end:   #15181e;
    --card-bg:       #1b1e24;
    --badge-bg:      #2a2e36;
    --badge-text:    #e4e6eb;
    --privacy-text:  #f2f2f2;
    --subtitle-text: #b7bcc4;
    --secure-text:   #8a8f98;
    --icon-stroke:   #a2a7b0;
}

html, body {
    margin: 0; padding: 0; width: 100%;
}

* { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: background 0.3s ease;
}

.card {
    background: var(--card-bg); width: 100%; max-width: 380px; min-height: 480px;
    padding: 35px 25px; border-radius: 25px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.3s ease;
    position: relative;
}

.avatar-ring {
    width: 126px; height: 126px; border-radius: 50%;
    background: linear-gradient(135deg, var(--privacy-grad-start), var(--privacy-grad-end));
    box-shadow: 0 8px 20px rgba(42,171,238,0.3);
    padding: 3px;
    margin-bottom: 15px;
}

.avatar {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; display: block;
    border: 2px solid #ffffff;
}

.avatar-ring { position: relative; }


.badge {
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 5px 14px;
    border-radius: 50px;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.3s ease, color 0.3s ease;
}

.badge-name {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.badge svg { width: 15px; height: 15px; flex-shrink: 0; }

.title { font-size: 22px; font-weight: 800; color: var(--privacy-text); margin-bottom: 6px; }

.subtitle { font-size: 13px; color: var(--subtitle-text); font-weight: 500; line-height: 1.4; margin-bottom: 15px; }

.online-status {
    font-size: 9px; color: #28a745; font-weight: 600; margin-bottom: 12px;
    background: #e9fbf0; padding: 3px 9px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid #c3e6cb;
}

.dot { width: 6px; height: 6px; background-color: #28a745; border-radius: 50%; animation: pulse-green 2s infinite; }

@keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
    70% { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
}

@keyframes btn-soft-pulse {
    0%, 100% { box-shadow: 0 5px 15px rgba(42,171,238,0.35); transform: scale(1); }
    50%       { box-shadow: 0 8px 28px rgba(42,171,238,0.65), 0 0 0 6px rgba(42,171,238,0.18); transform: scale(1.04); }
}



.btn {
    width: 100%; font-weight: 700; font-size: 15px; padding: 20px;
    border-radius: 50px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-transform: uppercase; text-decoration: none; color: #ffffff !important;
}

.icon-svg { 
    width: 22px; 
    height: 22px; 
    fill: #ffffff; 
    flex-shrink: 0;
}

.btn-telegram {
    background: linear-gradient(135deg, var(--privacy-grad-start), var(--privacy-grad-end));
    box-shadow: 0 5px 15px rgba(42,171,238,0.3);
    animation: btn-soft-pulse 2s ease-in-out infinite;
    transition: transform 0.2s;
    margin-top: 8px;
}

.btn-telegram:hover {
    transform: scale(1.02);
}

.secure-badge {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: auto; padding-top: 22px; font-size: 11px; font-weight: 500; color: var(--secure-text);
}

.lock-icon { width: 12px; height: 12px; flex-shrink: 0; }

/* Toggle modo escuro */
.theme-toggle {
    position: absolute; top: 16px; right: 16px;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--badge-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease, transform 0.2s ease;
}

.theme-toggle:hover { transform: scale(1.08); }

.theme-toggle svg { width: 18px; height: 18px; }

.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }

body.dark-mode .theme-toggle .icon-sun { display: block; }
body.dark-mode .theme-toggle .icon-moon { display: none; }

</style>
</head>

<body>
<script>if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }</script>

<div class="card">
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#4a4a4a"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4.5" fill="#f2c94c"/>
            <g stroke="#f2c94c" stroke-width="1.8" stroke-linecap="round">
                <line x1="12" y1="2" x2="12" y2="4.5"/>
                <line x1="12" y1="19.5" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="4.5" y2="12"/>
                <line x1="19.5" y1="12" x2="22" y2="12"/>
                <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/>
                <line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>
                <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/>
                <line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/>
            </g>
        </svg>
    </button>

    <div class="avatar-ring">
        <img src="imagem.jpg" class="avatar" alt="Sarra Rossi">
    </div>

    <div class="badge">
        <span class="badge-name">
            Bianca rossi
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l2.4 2.1 3.1-.5 1 3 2.9 1.4-.6 3.1 1.9 2.4-1.9 2.4.6 3.1-2.9 1.4-1 3-3.1-.5L12 22l-2.4-2.1-3.1.5-1-3-2.9-1.4.6-3.1L1.3 10.5l1.9-2.4-.6-3.1 2.9-1.4 1-3 3.1.5L12 2z" fill="#3897F0"/>
                <path d="M8.5 12.2l2.4 2.4 4.6-4.9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </div>

    <div class="title">Ficou Curioso?</div>
    <div class="subtitle">Acesso exclusivo ao conteúdo que não posto em nenhum outro lugar 🤭</div>

    <div class="online-status">
        <span class="dot"></span> online agora
    </div>

    <a  href="https://t.me/biancaarossi_bot"
        id="telegramBtn"
        class="btn btn-telegram"
        rel="noopener noreferrer"
        target="_blank">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l-.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/></svg>
        GRUPO grátis
    </a>

    <div class="secure-badge">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        site seguro e anônimo
    </div>
</div>

<script>
    (function() {
        var toggle = document.getElementById('themeToggle');

        toggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            var isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    })();

</script>

</body>
</html>
