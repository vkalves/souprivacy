<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bianca Rossi | Exclusivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script type="text/javascript">

        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "v67gqjmjp7");
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

:root {
    --privacy-grad-start: #2AABEE;
    --privacy-grad-end:   #229ED9;
    --privacy-accent:     #2AABEE;
    --privacy-text:       #343434;
    --bg-grad-start: #eaf6fd;
    --bg-grad-end:   #fcfcfc;
    --card-bg:       #ffffff;
    --badge-bg:      #e8edf1;
    --badge-text:    #4a4a4a;
    --subtitle-text: #555555;
    --secure-text:   #888888;
    --icon-stroke:   #777777;
}

body.dark-mode {
    --bg-grad-start: #0f1115;
    --bg-grad-end:   #15181e;
    --card-bg:       #1b1e24;
    --badge-bg:      #2a2e36;
    --badge-text:    #e4e6eb;
    --privacy-text:  #f2f2f2;
    --subtitle-text: #b7bcc4;
    --secure-text:   #8a8f98;
    --icon-stroke:   #a2a7b0;
}

html, body { margin: 0; padding: 0; width: 100%; }
* { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: background 0.3s ease;
}

.card {
    background: var(--card-bg); width: 100%; max-width: 380px; min-height: 480px;
    padding: 35px 25px; border-radius: 25px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.3s ease;
    position: relative;
}

/* ── Avatar Ring ── */
.avatar-ring {
    width: 126px; height: 126px; border-radius: 50%;
    margin-bottom: 15px;
    position: relative;
    cursor: pointer;
    background: transparent;
    padding: 0;
}

.avatar {
    width: 116px; height: 116px; border-radius: 50%;
    object-fit: cover; display: block;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    transition: transform 0.3s ease;
    /* Bloqueia o menu nativo de "salvar imagem" no toque longo */
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.avatar-ring:active .avatar {
    transform: translate(-50%, -50%) scale(0.96);
}

.story-ring-svg {
    position: absolute;
    inset: 0;
    width: 126px;
    height: 126px;
    pointer-events: none;
    overflow: visible;
}

.story-ring-track {
    fill: none;
    stroke: #d8e8f5;
    stroke-width: 3.5;
}

/* Arco azul — desenhado via JS (stroke-dashoffset animado com requestAnimationFrame) */
.story-ring-arc {
    fill: none;
    stroke: url(#blueGrad);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-dasharray: 370.7;
    stroke-dashoffset: 370.7;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    /* sem animation CSS — controlado via JS para rodar só 1x */
    transition: stroke-dashoffset 0.05s linear;
}

/* Brilho suave ao redor do anel quando completo */
.story-ring-glow {
    fill: none;
    stroke: #2AABEE;
    stroke-width: 7;
    stroke-linecap: round;
    opacity: 0;
    filter: blur(4px);
    stroke-dasharray: 370.7;
    stroke-dashoffset: 370.7;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    transition: opacity 0.4s ease;
}

.story-ring-glow.lit {
    opacity: 0.35;
    stroke-dashoffset: 0;
}

/* Pulso único de destaque: anel + foto saltam juntos no instante em que o traço completa */
@keyframes ring-complete-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.07); }
    60%  { transform: scale(0.99); }
    80%  { transform: scale(1.02); }
    100% { transform: scale(1); }
}

.avatar-ring.pop-once {
    animation: ring-complete-pulse 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── Lightbox ── */
.avatar-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: opacity 0.4s ease, background 0.4s ease, backdrop-filter 0.4s ease;
}

.avatar-lightbox.open {
    opacity: 1;
    pointer-events: all;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.lightbox-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.7) translateY(30px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
}

.avatar-lightbox.open .lightbox-inner {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.avatar-lightbox-img {
    width: 82vw;
    max-width: 310px;
    height: 82vw;
    max-height: 310px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(42,171,238,0.3),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(42,171,238,0.2);
    display: block;
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-select: none;
}

/* Anel azul ao redor da foto expandida */
.lightbox-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2.5px solid rgba(42,171,238,0.6);
    transform: scale(0.85);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) 0.1s, opacity 0.4s ease 0.1s;
}

.avatar-lightbox.open .lightbox-ring {
    transform: scale(1);
    opacity: 1;
}

/* Shimmer externo que aparece ao abrir */
.lightbox-shimmer {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(42,171,238,0.25);
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.2, 1, 0.4, 1) 0.15s, opacity 0.5s ease 0.15s;
}

.avatar-lightbox.open .lightbox-shimmer {
    transform: scale(1);
    opacity: 1;
}


/* ── Resto do layout ── */
.badge {
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 5px 14px;
    border-radius: 50px;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.3s ease, color 0.3s ease;
}

.badge-name { display: inline-flex; align-items: center; gap: 5px; }
.badge svg { width: 15px; height: 15px; flex-shrink: 0; }

.title { font-size: 22px; font-weight: 800; color: var(--privacy-text); margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--subtitle-text); font-weight: 500; line-height: 1.4; margin-bottom: 15px; }

.online-status {
    font-size: 9px; color: #28a745; font-weight: 600; margin-bottom: 12px;
    background: #e9fbf0; padding: 3px 9px; border-radius: 20px;
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid #c3e6cb;
}

.dot { width: 6px; height: 6px; background-color: #28a745; border-radius: 50%; animation: pulse-green 2s infinite; }

@keyframes pulse-green {
    0%   { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
    70%  { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
}

@keyframes btn-soft-pulse {
    0%, 100% { box-shadow: 0 5px 15px rgba(42,171,238,0.35); transform: scale(1); }
    50%       { box-shadow: 0 8px 28px rgba(42,171,238,0.65), 0 0 0 6px rgba(42,171,238,0.18); transform: scale(1.04); }
}

.btn {
    width: 100%; font-weight: 700; font-size: 15px; padding: 20px;
    border-radius: 50px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-transform: uppercase; text-decoration: none; color: #ffffff !important;
}

.icon-svg { width: 22px; height: 22px; fill: #ffffff; flex-shrink: 0; }

.btn-telegram {
    background: linear-gradient(135deg, var(--privacy-grad-start), var(--privacy-grad-end));
    box-shadow: 0 5px 15px rgba(42,171,238,0.3);
    animation: btn-soft-pulse 2s ease-in-out infinite;
    transition: transform 0.2s;
    margin-top: 8px;
}

.btn-telegram:hover { transform: scale(1.02); }

.secure-badge {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: auto; padding-top: 22px; font-size: 11px; font-weight: 500; color: var(--secure-text);
}

.lock-icon { width: 12px; height: 12px; flex-shrink: 0; }

.theme-toggle {
    position: absolute; top: 16px; right: 16px;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--badge-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease, transform 0.2s ease;
}

.theme-toggle:hover { transform: scale(1.08); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }
body.dark-mode .theme-toggle .icon-sun  { display: block; }
body.dark-mode .theme-toggle .icon-moon { display: none; }

</style>
</head>

<body>
<script>if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }</script>

<div class="card">
    <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#4a4a4a"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4.5" fill="#f2c94c"/>
            <g stroke="#f2c94c" stroke-width="1.8" stroke-linecap="round">
                <line x1="12" y1="2" x2="12" y2="4.5"/>
                <line x1="12" y1="19.5" x2="12" y2="22"/>
                <line x1="2" y1="12" x2="4.5" y2="12"/>
                <line x1="19.5" y1="12" x2="22" y2="12"/>
                <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/>
                <line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>
                <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/>
                <line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/>
            </g>
        </svg>
    </button>

    <div class="avatar-ring" id="avatarRing">
        <img src="imagem.jpg" class="avatar" alt="Sarra Rossi" draggable="false" oncontextmenu="return false;">
        <svg class="story-ring-svg" viewBox="0 0 126 126" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#54c8ff"/>
                    <stop offset="100%" stop-color="#1a8fc7"/>
                </linearGradient>
            </defs>
            <circle class="story-ring-track" cx="63" cy="63" r="59"/>
            <circle class="story-ring-glow" id="ringGlow" cx="63" cy="63" r="59"/>
            <circle class="story-ring-arc"  id="ringArc"  cx="63" cy="63" r="59"/>
        </svg>
    </div>

    <div class="badge">
        <span class="badge-name">
            bianca rossi
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 2l2.4 2.1 3.1-.5 1 3 2.9 1.4-.6 3.1 1.9 2.4-1.9 2.4.6 3.1-2.9 1.4-1 3-3.1-.5L12 22l-2.4-2.1-3.1.5-1-3-2.9-1.4.6-3.1L1.3 10.5l1.9-2.4-.6-3.1 2.9-1.4 1-3 3.1.5L12 2z" fill="#3897F0"/>
                <path d="M8.5 12.2l2.4 2.4 4.6-4.9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </div>

    <div class="title">Ficou Curioso?</div>

    <div class="online-status">

    </div>

    <a href="https://t.me/biancarossii"
       id="telegramBtn"

        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l-.002.001-.314 4.692c.46 0 .663-.211.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.228c.309-1.239-.473-1.8-1.282-1.434z"/></svg>

<!-- Lightbox -->
<div class="avatar-lightbox" id="avatarLightbox">
    <div class="lightbox-inner" id="lightboxInner">
        <div class="lightbox-shimmer"></div>
        <div class="lightbox-ring"></div>
        <img src="imagem.jpg" class="avatar-lightbox-img" alt="Sarra Rossi" draggable="false" oncontextmenu="return false;">
    </div>
</div>

<script>
// ── Tema ──
(function() {
    document.getElementById('themeToggle').addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    });
})();

// ── Animação do anel — roda 1x ao carregar ──
(function() {
    var arc      = document.getElementById('ringArc');
    var glow     = document.getElementById('ringGlow');
    var circ     = 370.7;
    var duration = 1600; // ms para fechar o arco
    var start    = null;
    var done     = false;

    // Easing: ease-in-out cúbico
    function easeInOut(t) {
        return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    }

    function step(ts) {
        if (!start) start = ts;
        var elapsed = ts - start;
        var progress = Math.min(elapsed / duration, 1);
        var eased = easeInOut(progress);

        // Arco vai de 370.7 → 0 (completo)
        arc.style.strokeDashoffset = circ * (1 - eased);

        if (progress < 1) {
            requestAnimationFrame(step);
        } else {
            // Anel completo: pulso único de destaque na foto+anel, depois fica parado e aceso
            var ringEl = document.getElementById('avatarRing');
            glow.style.strokeDashoffset = '0';
            glow.classList.add('lit');
            ringEl.classList.add('pop-once');
            setTimeout(function() {
                glow.classList.remove('lit');
                ringEl.classList.remove('pop-once');
            }, 550);
            done = true;
        }
    }

    // Pequeno delay para garantir que a página carregou
    setTimeout(function() {
        requestAnimationFrame(step);
    }, 300);

    // Corrige o bug do "voltar do Telegram": se a aba foi congelada (bfcache)
    // com a animação no meio do caminho, ao restaurar o navegador entrega um
    // timestamp com o tempo real (inclusive o tempo fora da página), fazendo
    // o anel "saltar"/piscar de forma abrupta. Em vez disso, completamos o
    // anel de forma calma, sem pulso surpresa.
    window.addEventListener('pageshow', function(e) {
        if (e.persisted && !done) {
            arc.style.transition = 'none';
            arc.style.strokeDashoffset = 0;
            glow.style.strokeDashoffset = 0;
            done = true;
            requestAnimationFrame(function() {
                arc.style.transition = 'stroke-dashoffset 0.05s linear';
            });
        }
    });
})();

// ── Lightbox ──
(function() {
    var ring     = document.getElementById('avatarRing');
    var lightbox = document.getElementById('avatarLightbox');
    var autoClose;

    function openLightbox() {
        lightbox.classList.add('open');
        clearTimeout(autoClose);
        autoClose = setTimeout(closeLightbox, 2000);
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        clearTimeout(autoClose);
    }

    ring.addEventListener('click', openLightbox);

    // Bloqueia o menu nativo de salvar imagem (toque longo / botão direito)
    ring.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Toque e segure no avatar do cabeçalho: abre a animação de expansão
    var holdTimer = null;
    var HOLD_MS = 280;

    ring.addEventListener('touchstart', function() {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(openLightbox, HOLD_MS);
    }, { passive: true });

    ring.addEventListener('touchend', function() {
        clearTimeout(holdTimer);
    });

    ring.addEventListener('touchcancel', function() {
        clearTimeout(holdTimer);
    });

    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });
})();
</script>
