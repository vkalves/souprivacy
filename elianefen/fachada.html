<!DOCTYPE html>
<html>
<head>
    <title>Carregando Conteúdo...</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f4; }
        .loader { border: 4px solid #ccc; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="loader" style="margin: 0 auto 15px;"></div>
        <p>Aguarde, preparando sua conexão segura...</p>
    </div>
</body>
</html>
