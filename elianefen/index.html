<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>eliane fen | Exclusivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap');

:root {
    --privacy-grad-start: #2AABEE;
    --privacy-grad-end:   #229ED9;
    --privacy-accent:     #2AABEE;
    --privacy-text:       #343434;
    --bg-grad-start: #eaf6fd;
    --bg-grad-end:   #fcfcfc;
    --card-bg:       #ffffff;
    --badge-bg:      #e8edf1;
    --badge-text:    #4a4a4a;
    --subtitle-text: #555555;
    --secure-text:   #888888;
    --icon-stroke:   #777777;
}

body.dark-mode {
    --bg-grad-start: #0f1115;
    --bg-grad-end:   #15181e;
    --card-bg:       #1b1e24;
    --badge-bg:      #2a2e36;
    --badge-text:    #e4e6eb;
    --privacy-text:  #f2f2f2;
    --subtitle-text: #b7bcc4;
    --secure-text:   #8a8f98;
    --icon-stroke:   #a2a7b0;
}

html, body { margin: 0; padding: 0; width: 100%; }
* { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
    display: flex; align-items: center; justify-content: center; padding: 20px;
    transition: background 0.3s ease;
}

.card {
    background: var(--card-bg); width: 100%; max-width: 410px; min-height: 500px;
    padding: 38px 28px; border-radius: 26px; text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; align-items: center;
    transition: background 0.3s ease;
    position: relative;
}

/* ── Avatar Ring ── */
.avatar-ring {
    width: 126px; height: 126px; border-radius: 50%;
    margin-bottom: 15px;
    position: relative;
    cursor: pointer;
    background: transparent;
    padding: 0;
}

.avatar {
    width: 116px; height: 116px; border-radius: 50%;
    object-fit: cover; display: block;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    transition: transform 0.3s ease;
    /* Bloqueia o menu nativo de "salvar imagem" no toque longo */
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.avatar-ring:active .avatar {
    transform: translate(-50%, -50%) scale(0.96);
}

.story-ring-svg {
    position: absolute;
    inset: 0;
    width: 126px;
    height: 126px;
    pointer-events: none;
    overflow: visible;
}

.story-ring-track {
    fill: none;
    stroke: transparent;
    stroke-width: 3.5;
}

/* Anel azul segmentado. A máscara revela os segmentos sem mover o anel. */
.story-ring-arc {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: 6 5;
    stroke-dashoffset: 0;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    opacity: 1;
}

.story-ring-solid {
    fill: none;
    stroke: var(--privacy-grad-start);
    stroke-width: 3.7;
    stroke-linecap: round;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
    opacity: 0;
}

@keyframes ringBlink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.15; }
}

.story-ring-solid.ring-blink {
    animation: ringBlink 0.25s ease-in-out 2;
}

.story-ring-reveal {
    fill: none;
    stroke: #fff;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 370.7 370.7;
    stroke-dashoffset: 370.7;
    transform-origin: 63px 63px;
    transform: rotate(-90deg);
}

/* Sem pulso, brilho ou escala ao completar. */
/* ── Lightbox ── */
.avatar-lightbox {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    background: rgba(0,0,0,0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    transition: opacity 0.4s ease, background 0.4s ease, backdrop-filter 0.4s ease;
}

.avatar-lightbox.open {
    opacity: 1;
    pointer-events: all;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.lightbox-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.7) translateY(30px);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
}

.avatar-lightbox.open .lightbox-inner {
    transform: scale(1) translateY(0);
    opacity: 1;
}

.avatar-lightbox-img {
    width: 82vw;
    max-width: 310px;
    height: 82vw;
    max-height: 310px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(42,171,238,0.3),
        0 20px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(42,171,238,0.2);
    display: block;
    pointer-events: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    user-select: none;
}

/* Anel azul ao redor da foto expandida */
.lightbox-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 2.5px solid rgba(42,171,238,0.6);
    transform: scale(0.85);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1) 0.1s, opacity 0.4s ease 0.1s;
}

.avatar-lightbox.open .lightbox-ring {
    transform: scale(1);
    opacity: 1;
}

/* Shimmer externo que aparece ao abrir */
.lightbox-shimmer {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px solid rgba(42,171,238,0.25);
    transform: scale(0.8);
    opacity: 0;
    transition: transform 0.7s cubic-bezier(0.2, 1, 0.4, 1) 0.15s, opacity 0.5s ease 0.15s;
}

.avatar-lightbox.open .lightbox-shimmer {
    transform: scale(1);
    opacity: 1;
}


/* ── Resto do layout ── */
.badge {
    font-family: 'Montserrat', sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.15px;
    text-transform: none;
    color: var(--badge-text);
    background: var(--badge-bg);
    padding: 5px 14px;
    border-radius: 50px;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 0.3s ease, color 0.3s ease;
}

.badge-name { display: inline-flex; align-items: center; gap: 5px; }

.verified-icon {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transform-origin: center;
}

.verified-icon svg {
    width: 16px;
    height: 16px;
    display: block;
    overflow: visible;
}

.verified-icon.pulse {
    animation: verified-pulse 850ms cubic-bezier(0.22, 1, 0.36, 1) 1;
}

@keyframes verified-pulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.18); }
    58%  { transform: scale(0.96); }
    78%  { transform: scale(1.08); }
    100% { transform: scale(1); }
}

.title { font-size: 22px; font-weight: 800; color: var(--privacy-text); margin-bottom: 6px; }
.subtitle { font-size: 13px; color: var(--subtitle-text); font-weight: 500; line-height: 1.4; margin-bottom: 15px; }

.telegram-online-status {
    margin-top: 3px;
    font-size: 10px;
    color: #28a745;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
    width: fit-content;
}

body.dark-mode .telegram-online-status {
    color: #74d68b;
}

.dot { width: 6px; height: 6px; background-color: #28a745; border-radius: 50%; animation: pulse-green 2s infinite; }

body.dark-mode .dot {
    background-color: #74d68b;
}

@keyframes pulse-green {
    0%   { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
    70%  { box-shadow: 0 0 0 6px rgba(40, 167, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
}

.btn {
    width: 100%;
    min-height: 70px;
    font-weight: 800;
    font-size: 16px;
    padding: 15px 18px;
    border-radius: 19px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-transform: none;
    text-decoration: none;
    color: #ffffff !important;
    -webkit-tap-highlight-color: transparent;
}

.telegram-logo {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: block;
    transform-origin: center;
}

@keyframes telegramButtonGlow {
    0%, 100% {
        border-color: rgba(34,158,217,0.14);
        box-shadow: 0 0 0 rgba(34,158,217,0);
    }
    50% {
        border-color: rgba(34,158,217,0.27);
        box-shadow: 0 6px 18px rgba(34,158,217,0.08);
    }
}

@keyframes telegramSweep {
    0%, 62% { transform: translateX(-150%); opacity: 0; }
    70% { opacity: 0.32; }
    88% { opacity: 0.18; }
    100% { transform: translateX(170%); opacity: 0; }
}

.telegram-btn-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    line-height: 1.15;
}

.telegram-btn-main {
    font-size: 15px;
    font-weight: 800;
    color: var(--privacy-text);
}

.tiktok-title-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.tiktok-title-row .verified-icon {
    width: 15px;
    height: 15px;
}

.tiktok-title-row .verified-icon svg {
    width: 15px;
    height: 15px;
}

.telegram-btn-sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--subtitle-text);
    opacity: 0.78;
}

.telegram-arrow {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    font-weight: 500;
    color: #229ED9;
    background: rgba(34,158,217,0.10);
    transition: transform 0.18s ease, background 0.18s ease;
}

.btn-telegram {
    min-height: 70px;
    margin-top: 10px;
    padding: 14px 16px;
    justify-content: flex-start;
    gap: 11px;
    background: var(--badge-bg);
    border: 1px solid rgba(34,158,217,0.14);
    box-shadow: none;
    color: var(--privacy-text) !important;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    animation: telegramButtonGlow 2.8s ease-in-out infinite;
}

.btn-telegram::after {
    content: '';
    position: absolute;
    top: -35%;
    bottom: -35%;
    left: -28%;
    width: 18%;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(34,158,217,0.15), transparent);
    transform: translateX(-150%);
    animation: telegramSweep 4.2s ease-in-out infinite;
}

.btn-telegram:hover {
    animation-play-state: paused;
    transform: translateY(-1px);
    border-color: rgba(34,158,217,0.38);
    box-shadow: 0 7px 18px rgba(34,158,217,0.12);
}

.btn-telegram:hover .telegram-arrow {
    transform: translateX(2px);
    background: rgba(34,158,217,0.16);
}

.btn-telegram:hover::after {
    animation-play-state: paused;
}

.btn-telegram:active {
    transform: scale(0.985);
    box-shadow: none;
}

.btn-telegram:focus-visible {
    outline: 2px solid rgba(42,171,238,0.30);
    outline-offset: 2px;
}

body.dark-mode .btn-telegram {
    background: var(--badge-bg);
    border-color: rgba(42,171,238,0.18);
}



/* ── Botão TikTok ── */
.tiktok-logo {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: block;
    overflow: visible;
    border-radius: 50%;
    transform-origin: center;
    animation: tiktokLogoPulse 2.8s ease-in-out infinite;
    animation-delay: 1.4s;
}

@keyframes tiktokLogoPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
}

@keyframes tiktokButtonGlow {
    0%, 100% {
        border-color: rgba(20,20,20,0.10);
        box-shadow: 0 0 0 rgba(37,244,238,0);
    }
    50% {
        border-color: rgba(37,244,238,0.24);
        box-shadow: 0 5px 16px rgba(254,44,85,0.06), 0 3px 13px rgba(37,244,238,0.06);
    }
}

.tiktok-arrow {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    font-weight: 500;
    color: var(--privacy-text);
    background: rgba(127,127,127,0.08);
    transition: transform 0.18s ease, background 0.18s ease;
}

.btn-tiktok {
    min-height: 70px;
    margin-top: 10px;
    padding: 14px 16px;
    justify-content: flex-start;
    gap: 11px;
    background: var(--badge-bg);
    border: 1px solid rgba(20,20,20,0.10);
    box-shadow: none;
    color: var(--privacy-text) !important;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    animation: tiktokButtonGlow 2.8s ease-in-out infinite;
    animation-delay: 1.4s;
}

.btn-tiktok:hover {
    animation-play-state: paused;
    transform: translateY(-1px);
    border-color: rgba(37,244,238,0.34);
    box-shadow: 0 7px 18px rgba(254,44,85,0.08), 0 4px 15px rgba(37,244,238,0.08);
}

.btn-tiktok:hover .tiktok-arrow {
    transform: translateX(2px);
    background: rgba(127,127,127,0.13);
}

.btn-tiktok:active {
    transform: scale(0.985);
    box-shadow: none;
}

.btn-tiktok:focus-visible {
    outline: 2px solid rgba(37,244,238,0.28);
    outline-offset: 2px;
}

body.dark-mode .btn-tiktok {
    background: var(--badge-bg);
    border-color: rgba(255,255,255,0.10);
}

@media (max-width: 460px) {
    body { padding: 14px; }
    .card {
        max-width: 100%;
        min-height: 490px;
        padding: 34px 22px;
    }
    .btn-telegram,
    .btn-tiktok {
        min-height: 68px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .btn-telegram,
    .btn-telegram::after,
    .telegram-logo,
    .btn-tiktok,
    .tiktok-logo {
        animation: none !important;
    }
}

/* ── Segurança — minimalista ── */
.secure-badge-wrap {
    width: 100%;
    margin-top: auto;
    padding-top: 17px;
    display: flex;
    justify-content: center;
}

.secure-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 2px 0;
    color: var(--secure-text);
    opacity: .78;
}

.secure-lock {
    width: 11px;
    height: 11px;
    display: grid;
    place-items: center;
    flex: 0 0 11px;
}

.secure-lock svg {
    width: 11px;
    height: 11px;
    display: block;
}

.secure-copy {
    display: inline-flex;
    align-items: center;
}

.secure-title {
    font-size: 9.2px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: .035em;
    color: inherit;
    white-space: nowrap;
}

.secure-sub { display: none; }

body.dark-mode .secure-badge { opacity: .72; }

.theme-toggle-wrap {
    position: absolute; top: 30px; right: 30px;
    width: 38px; height: 38px;
}

.theme-toggle {
    position: relative;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--badge-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease, transform 0.2s ease;
}

.theme-toggle:hover { transform: scale(1.08); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }
body.dark-mode .theme-toggle .icon-sun  { display: block; }
body.dark-mode .theme-toggle .icon-moon { display: none; }

/* Balão de aviso centralizado embaixo do botão, sempre alinhado independente da largura do texto */
.theme-hint {
    position: absolute;
    top: 47px;
    left: 50%;
    padding: 5px 9px;
    border-radius: 8px;
    white-space: nowrap;

    /* contraste discreto com o site claro */
    background: rgba(32, 35, 40, 0.92);
    color: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.10);

    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.1px;

    opacity: 0;
    transform: translateX(-50%) translateY(-3px);
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 2;

    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
}

.theme-hint::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    width: 7px;
    height: 7px;
    background: rgba(32, 35, 40, 0.92);
    transform: translateX(-50%) rotate(45deg);
}

.theme-hint.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* no modo escuro, o aviso usa o contraste inverso */
body.dark-mode .theme-hint {
    background: rgba(238, 240, 243, 0.94);
    color: #373b42;
    border-color: rgba(0, 0, 0, 0.04);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
}

body.dark-mode .theme-hint::before {
    background: rgba(238, 240, 243, 0.94);
}



/* ── Refinamento de alinhamento óptico ──
   Mantém o eixo central do card e organiza os dois CTAs na mesma grade. */
.btn-telegram,
.btn-tiktok {
    display: grid;
    grid-template-columns: 36px minmax(0, 1fr) 30px;
    align-items: center;
    column-gap: 12px;
    padding-left: 16px;
    padding-right: 16px;
}

.telegram-logo,
.tiktok-logo {
    width: 36px;
    height: 36px;
    flex: none;
    justify-self: center;
}

.telegram-btn-text {
    min-width: 0;
    justify-self: start;
    align-self: center;
}

.telegram-arrow,
.tiktok-arrow {
    margin-left: 0;
    justify-self: end;
    align-self: center;
}

.telegram-online-status {
    margin-top: 4px;
    line-height: 1.05;
}

.telegram-online-status .dot {
    position: relative;
    top: -0.2px;
}

.tiktok-title-row {
    line-height: 1;
}

.tiktok-title-row .verified-icon {
    transform: translateY(0.4px);
}

/* O foco de movimento fica somente no Telegram, como CTA principal. */
.btn-tiktok,
.tiktok-logo {
    animation: none;
}

/* Ritmo vertical um pouco mais uniforme. */
.subtitle {
    margin-bottom: 13px;
}

.btn-telegram {
    margin-top: 8px;
}

.btn-tiktok {
    margin-top: 10px;
}

.secure-badge-wrap {
    padding-top: 16px;
}

.secure-lock {
    transform: translateY(-0.2px);
}

</style>
</head>

<body>
<script>if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }</script>

<div class="card">
    <div class="theme-toggle-wrap">
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo escuro">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#4a4a4a"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="4.5" fill="#f2c94c"/>
                <g stroke="#f2c94c" stroke-width="1.8" stroke-linecap="round">
                    <line x1="12" y1="2" x2="12" y2="4.5"/>
                    <line x1="12" y1="19.5" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="4.5" y2="12"/>
                    <line x1="19.5" y1="12" x2="22" y2="12"/>
                    <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/>
                    <line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/>
                    <line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/>
                    <line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/>
                </g>
            </svg>

<script>
// ── Tema ──
(function() {
    var toggle = document.getElementById('themeToggle');

    function syncThemeButtonLabel() {
        var isDark = document.body.classList.contains('dark-mode');

        toggle.setAttribute(
            'aria-label',
            isDark ? 'Ativar modo claro' : 'Ativar modo escuro'
        );
    }

    syncThemeButtonLabel();

    toggle.addEventListener('click', function() {
        document.body.classList.toggle('dark-mode');

        localStorage.setItem(
            'theme',
            document.body.classList.contains('dark-mode') ? 'dark' : 'light'
        );

        // Atualiza apenas o botão imediatamente.
        // O texto da notificação é atualizado somente na próxima exibição.
        syncThemeButtonLabel();
    });
})();

// ── Dica do botão de tema ──
(function() {
    var hint = document.getElementById('themeHint');
    var toggle = document.getElementById('themeToggle');
    if (!hint || !toggle) return;

    var timesShown = 0;
    var maxShows = 2;
    var themeClicked = false;
    var hideTimer = null;
    var secondShowTimer = null;

    function getNextThemeLabel() {
        return document.body.classList.contains('dark-mode')
            ? 'modo claro'
            : 'modo escuro';
    }

    function showHint() {
        // Depois que o botão foi clicado, nenhuma nova notificação é enviada.
        if (themeClicked || timesShown >= maxShows) return;

        // O texto só é atualizado no instante em que uma nova notificação aparece.
        hint.textContent = getNextThemeLabel();
        timesShown++;

        hint.classList.add('show');

        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
            hint.classList.remove('show');

            // Se a primeira terminou e o usuário ainda não clicou no tema,
            // agenda a segunda para 3 segundos depois.
            if (!themeClicked && timesShown === 1) {
                clearTimeout(secondShowTimer);
                secondShowTimer = setTimeout(showHint, 3000);
            }
        }, 2000);
    }

    // Primeira notificação ao carregar.
    setTimeout(showHint, 500);

    toggle.addEventListener('click', function() {
        themeClicked = true;

        // Cancela somente futuras notificações.
        // Se a primeira já estiver visível, ela termina normalmente,
        // sem trocar o texto antes de desaparecer.
        clearTimeout(secondShowTimer);
    });
})();

// ── Pulso suave do verificado, 3s após a inicialização ──
(function() {
    var verified = document.getElementById('verifiedIcon');
    if (!verified) return;

    setTimeout(function() {
        verified.classList.add('pulse');

        verified.addEventListener('animationend', function handler() {
            verified.classList.remove('pulse');
            verified.removeEventListener('animationend', handler);
        });
    }, 3000);
})();

// ── Animação do anel segmentado — exatamente 2 execuções ──
(function() {
    var arc       = document.getElementById('ringArc');
    var solid     = document.getElementById('ringSolid');
    var reveal    = document.getElementById('ringReveal');
    var circ      = 370.7;
    var duration  = 430;
    var close     = 340;
    var pause     = 130;
    var cycles    = 1;
    var cycle     = 0;
    var start     = null;
    var timer     = null;
    var stopped   = false;

    function easeInOut(t) {
        return t < 0.5
            ? 4 * t * t * t
            : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /*
     * Easing suave para o crossfade de opacidade entre o anel
     * segmentado e o anel sólido.
     */
    function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
    }

    function setReveal(value) {
        reveal.style.strokeDashoffset = value;
    }

    function setOpacity(el, value) {
        el.style.opacity = value;
    }

    function startCycle() {
        setOpacity(arc, 1);
        setOpacity(solid, 0);
        setReveal(circ);
        arc.style.strokeDasharray = '6 5';
        start = null;
        requestAnimationFrame(step);
    }

    function step(ts) {
        if (stopped) return;
        if (start === null) start = ts;

        var progress = Math.min((ts - start) / duration, 1);
        var eased = easeInOut(progress);

        setReveal(circ * (1 - eased));

        if (progress < 1) {
            requestAnimationFrame(step);
            return;
        }

        /*
         * O último segmento chega ao ponto inicial sem trocar de desenho.
         * Só depois começa a fusão visual entre as duas versões do anel.
         */
        setReveal(0);

        var closeStart = null;

        function closeFrame(now) {
            if (stopped) return;
            if (closeStart === null) closeStart = now;

            var p = Math.min((now - closeStart) / close, 1);
            var easedClose = easeOutQuart(p);

            /*
             * Crossfade: o círculo segmentado perde presença enquanto o
             * círculo inteiro surge exatamente na mesma posição.
             */
            setOpacity(arc, 1 - easedClose);
            setOpacity(solid, easedClose);

            /*
             * Enquanto fecha, o espaço entre os pedaços do anel vai
             * diminuindo até virar uma linha contínua — os pedaços vão
             * se juntando em vez de ficarem soltos.
             */
            arc.style.strokeDasharray = '6 ' + (5 * (1 - easedClose)).toFixed(2);

            if (p < 1) {
                requestAnimationFrame(closeFrame);
                return;
            }

            setOpacity(arc, 0);
            setOpacity(solid, 1);

            cycle++;

            if (cycle >= cycles) {
                stopped = true;

                /* Assim que o anel fecha, ele pisca duas vezes. */
                solid.classList.add('ring-blink');
                solid.addEventListener('animationend', function handler() {
                    solid.classList.remove('ring-blink');
                    solid.removeEventListener('animationend', handler);
                });

                return;
            }

            /*
             * Mantém o círculo inteiro por um instante antes de iniciar
             * discretamente o próximo percurso.
             */
            timer = setTimeout(function() {
                if (!stopped) startCycle();
            }, pause);
        }

        requestAnimationFrame(closeFrame);
    }

    setReveal(circ);
    setOpacity(arc, 1);
    setOpacity(solid, 0);

    setTimeout(function() {
        startCycle();
    }, 300);

    window.addEventListener('pageshow', function(e) {
        if (e.persisted && !stopped) {
            clearTimeout(timer);
            stopped = true;
            setReveal(0);
            setOpacity(arc, 0);
            setOpacity(solid, 1);
        }
    });
})();

// ── Lightbox ──
(function() {
    var ring     = document.getElementById('avatarRing');
    var lightbox = document.getElementById('avatarLightbox');
    var autoClose;

    function openLightbox() {
        lightbox.classList.add('open');
        clearTimeout(autoClose);
        autoClose = setTimeout(closeLightbox, 2000);
    }

    function closeLightbox() {
        lightbox.classList.remove('open');
        clearTimeout(autoClose);
    }

    ring.addEventListener('click', openLightbox);

    // Bloqueia o menu nativo de salvar imagem (toque longo / botão direito)
    ring.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // Toque e segure no avatar do cabeçalho: abre a animação de expansão
    var holdTimer = null;
    var HOLD_MS = 280;

    ring.addEventListener('touchstart', function() {
        clearTimeout(holdTimer);
        holdTimer = setTimeout(openLightbox, HOLD_MS);
    }, { passive: true });

    ring.addEventListener('touchend', function() {
        clearTimeout(holdTimer);
    });

    ring.addEventListener('touchcancel', function() {
        clearTimeout(holdTimer);
    });

    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });
})();
</script>
