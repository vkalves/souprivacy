<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf5">
  <title>Chamada de vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#292b2e;--muted:#727478;--orange:#bb5200;--orange-1:#ff7c00;--orange-2:#ff9800;--orange-3:#ffc000;--line:#eeece9;--paper:#fffaf5;--danger:#ef5350;--soft-shadow:0 20px 70px rgba(75,45,20,.10);--small-shadow:0 10px 30px rgba(75,45,20,.10)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;background:#f4f2ef}
    body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(255,152,0,.32);outline-offset:3px}
    .phone{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(circle at 12% 6%,rgba(255,192,0,.16),transparent 28%),radial-gradient(circle at 95% 28%,rgba(255,124,0,.12),transparent 35%),var(--paper);isolation:isolate}
    .phone::before{content:"";position:absolute;inset:-25%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,157,0,.13),transparent 28%);opacity:0}
    .phone[data-state="incoming"]::before{animation:incomingGlow 2.8s ease-in-out infinite}
    @keyframes incomingGlow{0%,100%{opacity:.25;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
    @media(min-width:560px){body{padding:28px}.phone{height:min(900px,94dvh);border:1px solid rgba(41,43,46,.08);border-radius:38px;box-shadow:var(--soft-shadow)}}
    .ambient{position:absolute;border-radius:999px;filter:blur(10px);pointer-events:none;z-index:-1}.ambient.a{width:180px;height:180px;left:-95px;top:140px;background:rgba(255,152,0,.12)}.ambient.b{width:210px;height:210px;right:-130px;bottom:140px;background:rgba(255,192,0,.14)}
    .phone[data-state="incoming"] .ambient.a{animation:driftA 6s ease-in-out infinite}.phone[data-state="incoming"] .ambient.b{animation:driftB 7s ease-in-out infinite}
    @keyframes driftA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22px,16px,0) scale(1.12)}}
    @keyframes driftB{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-18px,-20px,0) scale(1.08)}}
    .topbar{position:relative;z-index:20;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px 10px}
    .phone[data-state="incoming"] .topbar{animation:introTop .72s cubic-bezier(.22,1,.36,1) both}
    @keyframes introTop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
    .top-icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.84);display:grid;place-items:center;color:var(--ink);box-shadow:0 5px 18px rgba(41,43,46,.05)}.top-icon svg{width:20px;height:20px;fill:currentColor}.top-icon.hidden{visibility:hidden}
    .brand{text-align:center;min-width:0}.brand-kicker{font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.16em;color:#a5a19d;margin-bottom:5px}.brand-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;background:#111}.phone[data-state="in-call"].has-remote .remote-video{display:block}
    .video-overlay{position:absolute;inset:0;z-index:2;display:none;pointer-events:none;background:linear-gradient(180deg,rgba(15,14,13,.45) 0%,rgba(15,14,13,.08) 30%,rgba(15,14,13,.10) 56%,rgba(15,14,13,.70) 100%)}.phone[data-state="in-call"].has-remote .video-overlay{display:block}
    .phone.signal-drop .remote-video{animation:signalJitter .22s steps(2,end) infinite;filter:saturate(.75) contrast(1.05)}
    .phone.signal-drop .video-overlay{display:block;background:linear-gradient(180deg,rgba(15,14,13,.26),rgba(15,14,13,.15),rgba(15,14,13,.58))}
    @keyframes signalJitter{0%{transform:translate(0,0) scale(1.002)}35%{transform:translate(-1px,1px) scale(1.005)}70%{transform:translate(1px,0) scale(1.003)}100%{transform:translate(0,0) scale(1.002)}}
    .media-status{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:rgba(20,18,16,.46);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;text-align:center;padding:24px}.media-status.show{display:grid}.media-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 20px;border-radius:20px;background:rgba(20,18,16,.48);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:700}.media-spinner{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.24);border-top-color:#fff;animation:mediaSpin .75s linear infinite}@keyframes mediaSpin{to{transform:rotate(360deg)}}
    .pause-screen{position:absolute;inset:0;z-index:11;display:none;place-items:center;background:radial-gradient(circle at 50% 36%,rgba(255,152,0,.12),transparent 34%),rgba(18,17,16,.90);color:#fff;text-align:center;padding:24px}.pause-screen.show{display:grid}.pause-card{display:flex;flex-direction:column;align-items:center;gap:10px}.pause-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 34px rgba(0,0,0,.22)}.pause-icon svg{width:28px;height:28px;fill:#fff}.pause-title{font-size:20px;font-weight:700}.pause-sub{max-width:260px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.72)}
    .stage{position:relative;z-index:6;height:calc(100% - 72px);display:flex;flex-direction:column;align-items:center;padding:34px 32px calc(138px + env(safe-area-inset-bottom));text-align:center}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(187,82,0,.10);border-radius:999px;background:rgba(255,255,255,.82);font-size:12px;font-weight:600;color:var(--orange);box-shadow:0 8px 24px rgba(112,66,21,.06)}
    .phone[data-state="incoming"] .eyebrow{animation:introBadge .75s .10s cubic-bezier(.22,1,.36,1) both}@keyframes introBadge{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--orange-1),var(--orange-3));box-shadow:0 0 0 5px rgba(255,152,0,.10)}.phone[data-state="incoming"] .eyebrow-dot{animation:statusPing 1.8s ease-out infinite}@keyframes statusPing{0%,100%{box-shadow:0 0 0 4px rgba(255,152,0,.08)}50%{box-shadow:0 0 0 9px rgba(255,152,0,0)}}
    .avatar-wrap{position:relative;width:174px;height:174px;margin:38px auto 28px}.phone[data-state="incoming"] .avatar-wrap{animation:avatarEntrance .9s .16s cubic-bezier(.16,1,.3,1) both,avatarFloat 3.2s 1.2s ease-in-out infinite}@keyframes avatarEntrance{0%{opacity:0;transform:translateY(20px) scale(.78)}65%{opacity:1;transform:translateY(-3px) scale(1.035)}100%{opacity:1;transform:none}}@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .avatar-wrap::before{content:"";position:absolute;inset:-21px;border-radius:50%;background:radial-gradient(circle,rgba(255,155,0,.13),rgba(255,155,0,0) 68%);opacity:0;transform:scale(.8)}.phone[data-state="incoming"] .avatar-wrap::before{animation:aura 2.25s .8s ease-out infinite}@keyframes aura{0%{opacity:.1;transform:scale(.84)}45%{opacity:.8}100%{opacity:0;transform:scale(1.20)}}
    .avatar-ring,.avatar-ring::after{position:absolute;inset:0;border-radius:50%;content:""}.avatar-ring{border:1px solid rgba(255,152,0,.28);animation:ring 2.35s ease-out infinite}.avatar-ring::after{border:1px solid rgba(255,192,0,.23);animation:ring 2.35s 1.1s ease-out infinite}@keyframes ring{0%{transform:scale(.96);opacity:0}18%{opacity:1}100%{transform:scale(1.42);opacity:0}}
    .avatar{position:absolute;inset:10px;border-radius:50%;overflow:hidden;background:#f0ece8;box-shadow:0 18px 45px rgba(83,49,18,.16),0 0 0 6px rgba(255,255,255,.82)}.phone[data-state="incoming"] .avatar{animation:avatarBeat 1.7s 1.1s ease-in-out infinite}@keyframes avatarBeat{0%,100%{box-shadow:0 18px 45px rgba(83,49,18,.16),0 0 0 6px rgba(255,255,255,.82)}50%{box-shadow:0 21px 52px rgba(255,132,0,.20),0 0 0 7px rgba(255,255,255,.92)}}
    .avatar img{width:100%;height:100%;display:block;object-fit:cover}.avatar-fallback{position:absolute;inset:0;display:none;place-items:center;background:#f2eee9;color:#b4aca5}.avatar-fallback svg{width:54px;height:54px;fill:currentColor}.avatar.no-photo img{display:none}.avatar.no-photo .avatar-fallback{display:grid}
    .name-line{display:flex;align-items:center;justify-content:center;gap:7px}.phone[data-state="incoming"] .name-line{animation:introText .72s .34s cubic-bezier(.22,1,.36,1) both}.name{font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.035em}.verified{width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--orange-1),var(--orange-3));color:#fff;box-shadow:0 4px 12px rgba(255,124,0,.22)}.verified svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.phone[data-state="incoming"] .verified{animation:verifiedPop .65s .68s cubic-bezier(.18,1.4,.32,1) both}@keyframes verifiedPop{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
    .substatus{margin-top:12px;color:var(--muted);font-size:15px;line-height:1.45}.phone[data-state="incoming"] .substatus{animation:introText .72s .44s cubic-bezier(.22,1,.36,1) both}@keyframes introText{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .timer{display:none;margin-top:12px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
    .connecting-card{display:none;margin-top:24px;padding:11px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.78);color:var(--muted);font-size:13px;box-shadow:0 10px 24px rgba(41,43,46,.04)}.phone[data-state="connecting"] .connecting-card{display:block;animation:connectIn .45s cubic-bezier(.22,1,.36,1) both}@keyframes connectIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
    .phone.recovering .connecting-card{display:inline-flex!important;align-items:center;gap:9px;color:var(--orange);font-weight:700;background:rgba(255,255,255,.92)}.phone.recovering .connecting-card::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,152,0,.20);border-top-color:var(--orange-2);animation:recoverySpin .7s linear infinite}.phone.recovering .controls{pointer-events:none;opacity:.58;filter:saturate(.7)}.phone.recovering .stage{animation:recoveryBreath 1.25s ease-in-out infinite}@keyframes recoverySpin{to{transform:rotate(360deg)}}@keyframes recoveryBreath{0%,100%{opacity:1}50%{opacity:.72}}
    .phone[data-state="in-call"].has-remote .stage{align-items:flex-start;text-align:left;padding-top:18px;color:#fff;pointer-events:none}.phone[data-state="in-call"].has-remote .eyebrow,.phone[data-state="in-call"].has-remote .avatar-wrap{display:none}.phone[data-state="in-call"].has-remote .name-line{justify-content:flex-start}.phone[data-state="in-call"].has-remote .name{font-size:27px;text-shadow:0 2px 12px rgba(0,0,0,.28)}.phone[data-state="in-call"] .substatus{display:none}.phone[data-state="in-call"] .timer{display:block}.phone[data-state="in-call"].has-remote .timer{color:rgba(255,255,255,.92);text-shadow:0 1px 10px rgba(0,0,0,.25)}
    .self-cam{position:absolute;top:calc(90px + env(safe-area-inset-top));right:16px;width:104px;height:150px;border-radius:22px;overflow:hidden;z-index:15;display:none;background:#e7e2dd;border:2px solid rgba(255,255,255,.85);box-shadow:0 16px 38px rgba(0,0,0,.22)}.phone[data-state="connecting"] .self-cam,.phone[data-state="in-call"] .self-cam{display:block;animation:selfIn .45s cubic-bezier(.22,1,.36,1) both}@keyframes selfIn{from{opacity:0;transform:translateY(-8px) scale(.88)}to{opacity:1;transform:none}}.self-video{width:100%;height:100%;display:block;object-fit:cover;background:#111}.self-placeholder{display:none;position:absolute;inset:0;place-items:center;background:#eee8e1;color:#958d86}.self-placeholder svg{width:32px;height:32px;fill:currentColor}.self-cam.no-video .self-video,.self-cam.off .self-video{display:none}.self-cam.no-video .self-placeholder,.self-cam.off .self-placeholder{display:grid}
    .flip-cam{position:absolute;top:calc(92px + env(safe-area-inset-top));left:18px;z-index:16;width:44px;height:44px;border:0;border-radius:50%;display:none;place-items:center;background:rgba(255,255,255,.9);color:var(--ink);box-shadow:var(--small-shadow);cursor:pointer}.phone[data-state="connecting"] .flip-cam,.phone[data-state="in-call"] .flip-cam{display:grid}.flip-cam svg{width:21px;height:21px;fill:currentColor}.flip-cam.spin svg{animation:flipspin .5s ease}@keyframes flipspin{to{transform:rotate(360deg)}}
    .controls{position:absolute;left:18px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border:1px solid rgba(238,236,233,.86);border-radius:30px;background:rgba(255,255,255,.90);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 55px rgba(62,40,22,.13);padding:14px;transition:opacity .25s ease,filter .25s ease}.phone[data-state="incoming"] .controls{animation:controlsEntrance .82s .52s cubic-bezier(.16,1,.3,1) both}@keyframes controlsEntrance{0%{opacity:0;transform:translateY(34px) scale(.96)}70%{opacity:1;transform:translateY(-3px) scale(1.008)}100%{opacity:1;transform:none}}
    .incoming-controls,.incall-controls,.ended-controls{display:none}.phone[data-state="incoming"] .incoming-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phone[data-state="connecting"] .incall-controls,.phone[data-state="in-call"] .incall-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.phone[data-state="ended"] .ended-controls{display:block}
    .phone.one-time-ended .controls,.phone.one-time-ended .sound-toggle,.phone.one-time-ended .flip-cam,.phone.one-time-ended .self-cam{display:none!important}.phone.one-time-ended .stage{padding-bottom:40px}
    .action{position:relative;isolation:isolate;overflow:hidden;min-height:66px;border:0;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-weight:700;font-size:14px;transition:transform .16s ease,filter .2s ease,box-shadow .2s ease}.action:active{transform:scale(.97)}.action svg{width:21px;height:21px;fill:currentColor}.decline{background:#f5f2ef;color:#6f6b67;border:1px solid #ebe7e3}.phone[data-state="incoming"] .decline{animation:declineBreathe 2.7s 1.2s ease-in-out infinite}@keyframes declineBreathe{0%,72%,100%{transform:translateX(0)}78%{transform:translateX(-2px)}84%{transform:translateX(2px)}90%{transform:translateX(-1px)}}
    .accept{background:linear-gradient(110deg,var(--orange-1),var(--orange-2) 52%,var(--orange-3));color:#fff;box-shadow:0 12px 26px rgba(255,137,0,.26)}.phone[data-state="incoming"] .accept{animation:acceptCall 1.75s .9s cubic-bezier(.4,0,.2,1) infinite}@keyframes acceptCall{0%,100%{transform:translateY(0) scale(1);box-shadow:0 12px 26px rgba(255,137,0,.22)}45%{transform:translateY(-3px) scale(1.018);box-shadow:0 18px 38px rgba(255,137,0,.40)}60%{transform:translateY(-1px) scale(1.008);box-shadow:0 14px 31px rgba(255,137,0,.30)}}
    .mini-action{min-height:62px;border:0;border-radius:18px;background:#f6f3f0;color:var(--ink);display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:600}.mini-action svg{width:19px;height:19px;fill:currentColor}.mini-action.off{background:#ece7e2;color:#9c928a}.mini-action.end{background:#fff0ee;color:var(--danger)}.mini-action.chat-active{background:#fff3e6;color:var(--orange)}
    .restart{width:100%;min-height:62px;border:0;border-radius:21px;background:linear-gradient(110deg,var(--orange-1),var(--orange-2) 52%,var(--orange-3));color:#fff;font-weight:700;cursor:pointer}
    .sound-toggle{position:absolute;right:18px;top:calc(86px + env(safe-area-inset-top));z-index:18;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#6b6661;cursor:pointer;box-shadow:0 8px 22px rgba(50,36,24,.07)}.phone[data-state="incoming"] .sound-toggle{animation:soundIn .65s .32s cubic-bezier(.22,1,.36,1) both}@keyframes soundIn{from{opacity:0;transform:scale(.7) rotate(-16deg)}to{opacity:1;transform:none}}.sound-toggle svg{width:19px;height:19px;fill:currentColor}.phone:not([data-state="incoming"]) .sound-toggle{display:none}
    .chat-panel{position:absolute;left:12px;right:12px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:40;height:min(410px,58%);display:flex;flex-direction:column;border-radius:26px;background:rgba(255,255,255,.96);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(238,236,233,.92);box-shadow:0 24px 70px rgba(20,15,10,.26);transform:translateY(calc(100% + 130px));opacity:0;pointer-events:none;transition:transform .42s cubic-bezier(.16,1,.3,1),opacity .25s ease}.chat-panel.open{transform:translateY(0);opacity:1;pointer-events:auto}.chat-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}.chat-avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#eee}.chat-avatar img{width:100%;height:100%;object-fit:cover}.chat-meta{flex:1;min-width:0}.chat-name{font-size:14px;font-weight:700}.chat-status{font-size:11px;color:#8c8986;margin-top:1px}.chat-close{width:34px;height:34px;border:0;border-radius:50%;background:#f5f2ef;color:#666;display:grid;place-items:center;cursor:pointer}.chat-close svg{width:18px;height:18px;fill:currentColor}.chat-messages{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.4;animation:bubbleIn .35s cubic-bezier(.22,1,.36,1) both}.bubble.them{align-self:flex-start;background:#f3f0ed;color:#343434;border-bottom-left-radius:6px}.bubble.me{align-self:flex-end;background:linear-gradient(110deg,var(--orange-1),var(--orange-2));color:#fff;border-bottom-right-radius:6px}.bubble-time{display:block;margin-top:4px;font-size:9px;opacity:.62;text-align:right}@keyframes bubbleIn{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}
    .chat-countdown{display:none;margin:0 14px 10px;padding:9px 11px;border-radius:14px;background:#fff7ee;color:var(--orange);font-size:11px;font-weight:700;text-align:center}.chat-countdown.show{display:block}.chat-compose{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.chat-input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:#faf8f6;color:var(--ink)}.chat-send{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(110deg,var(--orange-1),var(--orange-2));color:#fff;cursor:pointer}.chat-send svg{width:18px;height:18px;fill:currentColor}
    @media(max-height:700px){.stage{padding-top:18px}.avatar-wrap{width:138px;height:138px;margin:22px auto 18px}.name{font-size:30px}.controls{bottom:calc(10px + env(safe-area-inset-bottom))}.topbar{padding-top:calc(12px + env(safe-area-inset-top))}.chat-panel{height:min(350px,56%)}}

    [hidden]{display:none!important}
    .media-action,.playback-sound{border:1px solid rgba(255,255,255,.35);background:rgba(20,18,16,.85);color:white;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:600}
    .playback-sound{position:absolute;z-index:35;left:18px;bottom:calc(116px + env(safe-area-inset-bottom));font-size:13px}
    .mini-action:disabled{opacity:.5;cursor:default}
    .phone:not([data-state="incoming"]) .avatar-ring,.phone:not([data-state="incoming"]) .avatar-ring::after{animation:none;opacity:0}
    .phone[data-state="in-call"] .flip-cam{top:calc(150px + env(safe-area-inset-top))}
    @media(max-height:550px){.stage{padding-top:6px;padding-bottom:110px}.avatar-wrap{width:90px;height:90px;margin:12px auto}.name{font-size:24px}.substatus{font-size:13px;margin-top:8px}.eyebrow{padding:5px 9px}.topbar{padding-top:6px}.controls{padding:9px}.action{min-height:52px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.phone.signal-drop .remote-video{transform:none}}
  </style>
</head>
<body>
  <main class="phone" data-state="incoming">
    <span class="ambient a"></span><span class="ambient b"></span>
    <video class="remote-video" id="remoteVideo" preload="none" playsinline webkit-playsinline muted disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>

  <script>
    const phone=document.querySelector('.phone'),callType=document.getElementById('callType'),subStatus=document.getElementById('subStatus'),timerEl=document.getElementById('timer'),acceptBtn=document.getElementById('acceptBtn'),declineBtn=document.getElementById('declineBtn'),endBtn=document.getElementById('endBtn'),restartBtn=document.getElementById('restartBtn'),soundToggle=document.getElementById('soundToggle'),muteMicBtn=document.getElementById('muteMicBtn'),videoBtn=document.getElementById('videoBtn'),chatBtn=document.getElementById('chatBtn'),flipBtn=document.getElementById('flipBtn'),remoteVideo=document.getElementById('remoteVideo'),selfVideo=document.getElementById('selfVideo'),selfCam=document.getElementById('selfCam'),avatarWrap=document.querySelector('.avatar-wrap'),connectingCard=document.getElementById('connectingCard'),mediaStatus=document.getElementById('mediaStatus'),mediaStatusText=document.getElementById('mediaStatusText'),pauseScreen=document.getElementById('pauseScreen'),chatPanel=document.getElementById('chatPanel'),chatClose=document.getElementById('chatClose'),chatMessages=document.getElementById('chatMessages'),chatCountdown=document.getElementById('chatCountdown'),chatStatus=document.getElementById('chatStatus'),chatForm=document.getElementById('chatForm'),chatInput=document.getElementById('chatInput');

    const INTERMISSION_MS=10000,STUTTER_FROM_END=4;
    let state='incoming',muted=false,audioCtx=null,ringTimer=null,vibTimer=null,callTimer=null;
    let seconds=0,clockBase=0,segment=0,sourceIndex=0,phase='video',intermissionEndsAt=0;
    let localStream=null,facingMode='user',cameraJob=null,flipping=false;
    let generation=0,sourceGeneration=0,started=false,resumeTime=0,countdownTimer=null;
    let loadTimer=null,stutterTimer=null,stutterRelease=null,stutterStarted=false,messages=[];
    const oscillators=new Set();
    const mediaAction=document.getElementById('mediaAction'),playbackSound=document.getElementById('playbackSound');
    const active=()=>state==='connecting'||state==='in-call';
    const fmt=n=>String(n).padStart(2,'0');
    function setState(s){state=s;phone.dataset.state=s;chatPanel.inert=!chatPanel.classList.contains('open');}
    function hasUsedCall(){try{return localStorage.getItem(CALL_USED_KEY)==='1'}catch{return false}}
    function markCallUsed(){try{localStorage.setItem(CALL_USED_KEY,'1')}catch{}}
    function storedCall(){try{const d=JSON.parse(sessionStorage.getItem(CALL_SESSION_KEY));return d?.active&&Date.now()-d.savedAt<86400000?d:null}catch{return null}}
    function clearSession(){try{sessionStorage.removeItem(CALL_SESSION_KEY)}catch{}}
    function saveCallSession(){if(!active())return;try{sessionStorage.setItem(CALL_SESSION_KEY,JSON.stringify({active:true,started,seconds,segment,phase,remoteTime:remoteVideo.currentTime||resumeTime||0,intermissionEndsAt,micOff:muteMicBtn.classList.contains('off'),videoOff:videoBtn.classList.contains('off'),facingMode,messages:messages.slice(-100),savedAt:Date.now()}))}catch{}}
    function renderTimer(){timerEl.textContent=fmt(Math.floor(seconds/60))+':'+fmt(seconds%60)}
    function startCallTimer(){if(callTimer)return;clockBase=Date.now()-seconds*1000;callTimer=setInterval(()=>{seconds=Math.floor((Date.now()-clockBase)/1000);renderTimer();saveCallSession()},1000);renderTimer()}

    function ensureAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!audioCtx&&AC)audioCtx=new AC();audioCtx?.resume().catch(()=>{})}catch{}}
    function beep(freq,start,dur){if(audioCtx?.state!=='running')return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+start;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.03);g.gain.linearRampToValueAtTime(0,t+dur);oscillators.add(o);o.onended=()=>{oscillators.delete(o);o.disconnect();g.disconnect()};o.start(t);o.stop(t+dur+.02)}
    function ringPattern(){if(state!=='incoming'||document.hidden)return;beep(1046,0,.17);beep(1318,.20,.18);beep(1046,.48,.18)}
    function startRinging(){if(muted||ringTimer||document.hidden)return;ensureAudio();ringPattern();ringTimer=setInterval(ringPattern,2400)}
    function stopRinging(){clearInterval(ringTimer);ringTimer=null;oscillators.forEach(o=>{try{o.stop()}catch{}});oscillators.clear()}
    function startVibration(){stopVibration();if(document.hidden)return;const vibrate=()=>{try{navigator.vibrate?.([420,320,420])}catch{}};vibrate();vibTimer=setInterval(vibrate,2400)}
    function stopVibration(){clearInterval(vibTimer);vibTimer=null;try{navigator.vibrate?.(0)}catch{}}
    function updateMirror(){selfVideo.style.transform=facingMode==='user'?'scaleX(-1)':'none'}
    function applyMicState(){const off=muteMicBtn.classList.contains('off');localStream?.getAudioTracks().forEach(t=>t.enabled=!off);muteMicBtn.setAttribute('aria-pressed',String(off));muteMicBtn.querySelector('span').textContent=off?'Mic. desligado':'Microfone'}
    function applyVideoState(){const off=videoBtn.classList.contains('off');selfCam.classList.toggle('off',off);localStream?.getVideoTracks().forEach(t=>t.enabled=!off);videoBtn.setAttribute('aria-pressed',String(off));videoBtn.querySelector('span').textContent=off?'Vídeo desligado':'Vídeo'}
    function stopTracks(s){s?.getTracks().forEach(t=>t.stop())}
    function attachStream(){selfVideo.srcObject=localStream;selfCam.classList.toggle('no-video',!localStream?.getVideoTracks().some(t=>t.readyState==='live'));muteMicBtn.disabled=!localStream?.getAudioTracks().length;updateMirror();selfVideo.play().catch(()=>{});applyMicState();applyVideoState()}
    async function startCamera(){
      if(cameraJob||localStream||!active())return;
      if(!navigator.mediaDevices?.getUserMedia){selfCam.classList.add('no-video');return}

        let stream;

      }catch{selfCam.classList.add('no-video')}
      finally{if(token===generation){cameraJob=null;if(!localStream){selfCam.classList.add('no-video');muteMicBtn.disabled=true}}}
    }
    async function flipCamera(){
      if(flipping||!localStream||!active())return;
      flipping=true;flipBtn.classList.add('spin');const token=generation,previous=facingMode,target=previous==='user'?'environment':'user';

    }
    function stopCamera(){stopTracks(localStream);localStream=null;selfVideo.srcObject=null;cameraJob=null;flipping=false;flipBtn.classList.remove('spin')}
    function showMediaStatus(text,action=''){mediaStatusText.textContent=text;mediaStatus.classList.add('show');mediaAction.hidden=!action;mediaAction.textContent=action;mediaStatus.querySelector('.media-spinner').hidden=!!action}
    function hideMediaStatus(){mediaStatus.classList.remove('show');mediaAction.hidden=true}
    function clearStutter(){clearInterval(stutterTimer);clearTimeout(stutterRelease);stutterTimer=stutterRelease=null;stutterStarted=false;phone.classList.remove('signal-drop')}
    function startStutter(){if(stutterStarted||document.hidden||segment!==0||phase!=='video')return;stutterStarted=true;phone.classList.add('signal-drop');stutterTimer=setInterval(()=>{if(state!=='in-call'||phase!=='video'||document.hidden){clearStutter();return}if(!remoteVideo.paused){remoteVideo.pause();stutterRelease=setTimeout(()=>{if(active()&&phase==='video'&&!document.hidden)playRemoteNow()},170+Math.random()*180)}},720)}
    function loadTimeout(){clearTimeout(loadTimer);loadTimer=setTimeout(()=>{if(active()&&phase==='video')showMediaStatus('A chamada está demorando para carregar.','Tentar novamente')},15000)}

    }
    function updatePlaybackSound(){playbackSound.hidden=!active()||phase!=='video'||!remoteVideo.muted}
    async function playRemoteNow(){
      if(!active()||phase!=='video'||document.hidden)return;
      const token=generation,source=sourceGeneration;
      try{await remoteVideo.play()}
      catch(e){
        if(token!==generation||source!==sourceGeneration||!active()||e.name==='AbortError')return;
        if(e.name==='NotAllowedError'&&!remoteVideo.muted){remoteVideo.muted=true;updatePlaybackSound();try{await remoteVideo.play();return}catch{}}

      }
      updatePlaybackSound();
    }
    function openChat(){if(!active())return;chatPanel.classList.add('open');chatPanel.inert=false;chatBtn.classList.add('chat-active');chatBtn.setAttribute('aria-expanded','true');chatMessages.scrollTop=chatMessages.scrollHeight}
    function closeChat(){chatPanel.classList.remove('open');chatPanel.inert=true;chatBtn.classList.remove('chat-active');chatBtn.setAttribute('aria-expanded','false')}
    function renderMessage(message){const b=document.createElement('div'),tm=document.createElement('span');b.className='bubble '+(message.who==='me'?'me':'them');b.textContent=message.text;tm.className='bubble-time';tm.textContent=new Date(message.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});b.appendChild(tm);chatMessages.appendChild(b);chatMessages.scrollTop=chatMessages.scrollHeight}

    function beginIntermission(){if(!active()||segment!==0||phase==='intermission')return;clearStutter();clearTimeout(loadTimer);phase='intermission';remoteVideo.pause();pauseScreen.classList.add('show');hideMediaStatus();phone.classList.remove('has-remote');intermissionEndsAt=Date.now()+INTERMISSION_MS;addMessage('Calma, amor, volto em 10 segundos.');openChat();updatePlaybackSound();saveCallSession();updateCountdown();countdownTimer=setInterval(updateCountdown,500)}
    function resumeWithSecondVideo(){if(!active()||phase!=='intermission')return;clearInterval(countdownTimer);countdownTimer=null;phase='video';segment=1;chatCountdown.classList.remove('show');chatStatus.textContent='na chamada';pauseScreen.classList.remove('show');closeChat();showMediaStatus('Retomando chamada…');setRemoteSource();saveCallSession();playRemoteNow()}
    function cleanupActiveCall(){generation++;sourceGeneration++;stopRinging();stopVibration();stopCallTimer();stopCamera();clearStutter();clearInterval(countdownTimer);clearTimeout(loadTimer);countdownTimer=null;remoteVideo.pause();remoteVideo.removeAttribute('src');remoteVideo.load();pauseScreen.classList.remove('show');phone.classList.remove('recovering','has-remote','signal-drop');hideMediaStatus();playbackSound.hidden=true;closeChat()}
    function finishCall(text){setState('ended');cleanupActiveCall();clearSession();phone.classList.toggle('one-time-ended',hasUsedCall());callType.textContent='Chamada encerrada';subStatus.textContent=text}
    function restoreCall(saved){

    }

    remoteVideo.addEventListener('stalled',()=>{if(active()&&phase==='video'&&!document.hidden){showMediaStatus('Reconectando chamada…');loadTimeout()}});

    remoteVideo.addEventListener('error',()=>{if(!active()||phase!=='video'||!remoteVideo.getAttribute('src'))return;clearTimeout(loadTimer);if(sourceIndex+1<SEGMENTS[segment].length){showMediaStatus('Restabelecendo chamada…');setRemoteSource(sourceIndex+1,remoteVideo.currentTime||resumeTime);playRemoteNow()}else showMediaStatus('Não foi possível carregar esta chamada.','Tentar novamente')});

    acceptBtn.addEventListener('click',()=>{if(state!=='incoming')return;if(hasUsedCall()){finishCall('Essa chamada não está mais disponível.');return}generation++;setState('connecting');stopRinging();stopVibration();ensureAudio();callType.textContent='Conectando';subStatus.textContent='Preparando chamada…';segment=0;phase='video';remoteVideo.muted=false;showMediaStatus('Estabelecendo chamada…');setRemoteSource();saveCallSession();playRemoteNow();startCamera()});
    declineBtn.addEventListener('click',()=>{if(state==='incoming')finishCall('Você recusou esta chamada.')});
    endBtn.addEventListener('click',()=>{if(active())finishCall('Duração da chamada: '+timerEl.textContent)});
    restartBtn.addEventListener('click',()=>{if(hasUsedCall()){finishCall('Essa chamada não está mais disponível.');return}cleanupActiveCall();clearSession();started=false;seconds=0;segment=0;phase='video';messages=[];chatMessages.replaceChildren();chatCountdown.classList.remove('show');chatStatus.textContent='na chamada';facingMode='user';muteMicBtn.classList.remove('off');videoBtn.classList.remove('off');applyMicState();applyVideoState();phone.classList.remove('one-time-ended');setState('incoming');callType.textContent='Chamada de vídeo recebida';subStatus.textContent='Ela está tentando falar com você agora.';renderTimer();startRinging();startVibration()});
    soundToggle.addEventListener('click',()=>{muted=!muted;soundToggle.setAttribute('aria-pressed',String(muted));soundToggle.setAttribute('aria-label',muted?'Ativar toque':'Silenciar toque');soundToggle.style.opacity=muted?'.55':'1';if(muted)stopRinging();else startRinging()});
    muteMicBtn.addEventListener('click',()=>{if(!active())return;muteMicBtn.classList.toggle('off');applyMicState();saveCallSession()});
    videoBtn.addEventListener('click',()=>{if(!active())return;videoBtn.classList.toggle('off');applyVideoState();if(!localStream&&!videoBtn.classList.contains('off'))startCamera();saveCallSession()});
    chatBtn.addEventListener('click',()=>chatPanel.classList.contains('open')?closeChat():openChat());chatClose.addEventListener('click',closeChat);
    chatForm.addEventListener('submit',e=>{e.preventDefault();if(!active())return;const text=chatInput.value.trim();if(text){addMessage(text,'me');chatInput.value=''}});
    flipBtn.addEventListener('click',flipCamera);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChat()});
    document.addEventListener('pointerdown',()=>{ensureAudio();if(state==='incoming')startRinging()},{once:true});
    document.addEventListener('visibilitychange',()=>{if(document.hidden){saveCallSession();stopRinging();stopVibration();clearStutter();remoteVideo.pause();clearTimeout(loadTimer)}else if(state==='incoming'){startRinging();startVibration()}else if(active()){if(phase==='intermission')updateCountdown();else playRemoteNow()}});
    window.addEventListener('online',()=>{if(active()&&phase==='video'){if(remoteVideo.error)setRemoteSource(0,remoteVideo.currentTime||resumeTime);playRemoteNow()}});
    window.addEventListener('pagehide',()=>{saveCallSession();setState('ended');cleanupActiveCall()});
    window.addEventListener('pageshow',e=>{if(e.persisted)init()});
    function init(){closeChat();updateMirror();chatMessages.replaceChildren();const saved=storedCall();if(saved){restoreCall(saved);return}if(hasUsedCall()){finishCall('Essa chamada não está mais disponível.');return}setState('incoming');selfCam.classList.add('no-video');applyMicState();applyVideoState();startVibration()}
    init();

  </script>
</body>
</html>
